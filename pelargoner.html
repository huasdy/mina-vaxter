<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelargon</title>
  <style>
    :root {
      --bg: #f5f1ea; --paper: #fffdf8; --ink: #2b251f; --muted: #6f655b;
      --line: #ded2c2; --accent: #7d4f3b; --chip: #efe6da;
      --shadow: 0 14px 40px rgba(62, 43, 28, 0.12); --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(125,79,59,0.10), transparent 35rem),
                  radial-gradient(circle at top right, rgba(96,119,97,0.10), transparent 30rem),
                  var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header { padding: 46px 22px 30px; text-align: center; }
    nav { margin-bottom: 18px; text-align: center; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 750; }
    nav a.current { color: var(--ink); }
    .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; color: var(--accent); font-weight: 800; }
    h1 { margin: 8px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem, 8vw, 5.6rem); line-height: .92; font-weight: 500; }
    .subtitle { margin: 0 auto; max-width: 860px; color: var(--muted); font-size: 1.05rem; }
    .toolbar {
      background: rgba(245,241,234,.84); border-top: 1px solid rgba(222,210,194,.75);
      border-bottom: 1px solid rgba(222,210,194,.95); padding: 14px 18px;
    }
    .toolbar-inner { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto auto auto auto auto; gap: 10px; align-items: center; }
    input, select, button, label.filebutton {
      border: 1px solid var(--line); background: var(--paper); border-radius: 999px; color: var(--ink);
      padding: 11px 14px; font-size: .95rem; font: inherit;
    }
    input[type="search"] { width: 100%; min-width: 0; }
    button, label.filebutton { cursor: pointer; background: var(--accent); color: white; border-color: var(--accent); font-weight: 750; white-space: nowrap; }
    button.secondary, label.filebutton.secondary { background: var(--paper); color: var(--accent); border-color: rgba(125,79,59,.35); }
    input[type="file"] { display: none; }
    main { max-width: 1240px; margin: 0 auto; padding: 26px 18px 64px; }
    .helpbox { max-width: 1240px; margin: 0 auto 18px; background: rgba(255,253,248,.78); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px; color: var(--muted); font-size: .92rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; color: var(--muted); }
    .stat { background: rgba(255,253,248,.74); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: .92rem; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 18px; }
    .empty { grid-column: 1 / -1; background: rgba(255,253,248,.78); border: 1px solid var(--line); border-radius: 18px; padding: 24px; color: var(--muted); text-align: center; font-weight: 650; }
    .plant-card { background: var(--paper); border: 1px solid rgba(222,210,194,.95); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 100%; }
    .image-wrap { position: relative; aspect-ratio: 4 / 5; background: linear-gradient(135deg, rgba(125,79,59,.16), rgba(96,119,97,.14)), #eadfce; overflow: hidden; }
    .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .date-ribbon { position: absolute; left: 12px; bottom: 12px; background: rgba(43,37,31,.76); color: white; border-radius: 999px; padding: 6px 10px; font-size: .8rem; font-weight: 750; backdrop-filter: blur(8px); }
    .thumbs { display: flex; gap: 8px; padding: 0; flex-wrap: wrap; margin-top: -2px; }
    .thumb { border: 2px solid transparent; background: transparent; padding: 0; border-radius: 12px; overflow: hidden; width: 58px; height: 58px; cursor: pointer; }
    .thumb.active { border-color: var(--accent); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; line-height: 1.08; font-weight: 650; }
    .plant-card[data-plant-id="p-odoratissimum-1"] h2 {
      font-size: 1.36rem;
      letter-spacing: -.025em;
      white-space: nowrap;
    }
    .plant-title-block { min-width: 0; }
    .plant-nickname { margin-top: -7px; color: var(--muted); font-style: italic; font-weight: 700; }
    .plant-card .plant-card-head { min-height: 82px; margin-bottom: 0; }
    .plant-card .plant-card-head .import-actions {
      align-self: start; flex-direction: column; justify-content: flex-start; margin-top: 0;
    }
    .plant-card .plant-card-head .import-badge { top: auto; right: -4px; bottom: -4px; }
    .plant-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .score { min-width: 42px; text-align: center; border-radius: 999px; background: var(--chip); color: var(--muted); padding: 5px 9px; font-weight: 800; font-size: .85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: .8rem; font-weight: 700; }
    .chip.green { background: rgba(96,119,97,.17); color: #435943; }
    .chip.gold { background: rgba(181,138,69,.18); color: #77572a; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: .94rem; }
    dt { color: var(--muted); font-weight: 800; }
    dd { margin: 0; }
    .notes { color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; font-size: .94rem; min-height: 2.2em; }
    dialog { border: none; padding: 0; background: transparent; max-width: min(92vw, 1000px); max-height: 92vh; }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .modal-img { display: block; max-width: 100%; max-height: 88vh; border-radius: 18px; background: white; }
    .modal-caption { color: white; text-align: center; padding-top: 10px; font-weight: 700; }
    footer { text-align: center; color: var(--muted); padding: 26px 18px 44px; font-size: .92rem; }
    @media (max-width: 700px) {
      .image-wrap { aspect-ratio: auto; height: min(280px, 65vw); }
    }
    @media (max-width: 900px) { .toolbar-inner { grid-template-columns: 1fr; } select, button, label.filebutton { width: 100%; text-align: center; } }
</style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">← Mina Växter</a>
      <a href="hibiskusar.html">Hibiskus</a>
      <a class="current" href="pelargoner.html">Pelargon</a>
      <a href="citrus.html">Citrus</a>
      <a href="udda.html">Udda</a>
      <a href="favoriter.html">Hundöron</a>
      <a href="sticklingar.html">Sticklingar</a>
      <a href="galleri.html">Galleri</a>
      <a href="verktyg.html">Verktyg</a>
    </nav>
    <div class="eyebrow">Privat samling</div>
    <h1>Pelargon</h1>
    <p class="subtitle">En lätt sort- och artsamling. Bara pelargoner som behöver följas separat får egna individkort.</p>
  </header>

  <section class="toolbar">
    <div class="toolbar-inner">
      <input id="search" type="search" placeholder="Sök sort, art, individ, doft, datum eller anteckning…">
      <select id="typeFilter" aria-label="Filtrera efter växttyp"><option value="">Alla pelargontyper</option></select>
      <select id="photoTypeFilter" aria-label="Filtrera efter vad bilden visar"><option value="">Alla bildtyper</option></select>
      <select id="sortSelect" aria-label="Sortering">
        <option value="name">Namn A-Ö</option>
        <option value="type">Typ</option>
        <option value="latest">Senaste bild</option>
        <option value="photos">Flest bilder</option>
      </select>
      <button class="secondary" id="clearBtn" type="button">Rensa</button>
    </div>
  </section>

  <main>
<div class="stats" id="stats"></div>
    <section class="grid" id="grid"></section>
  </main>

  <dialog id="photoDialog">
    <img class="modal-img" id="modalImg" alt="">
    <div class="modal-caption" id="modalCaption"></div>
  </dialog>

  <footer>Serverfri lokal HTML-katalog.</footer>

  <script src="common.js?v=20260821synk1945"></script>
  <script>
    function startPelargonPage(snapshot) {
    let plants = [];
    const pelargonSection = snapshot.categories.Pelargon;
    const plantRows = pelargonSection.plants;
    const photoRows = pelargonSection.photos;
    const milestoneRows = snapshot.milestones;

    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const typeFilter = document.querySelector("#typeFilter");
    const photoTypeFilter = document.querySelector("#photoTypeFilter");
    const sortSelect = document.querySelector("#sortSelect");
    const clearBtn = document.querySelector("#clearBtn");
    const stats = document.querySelector("#stats");
    const dialog = document.querySelector("#photoDialog");
    const modalImg = document.querySelector("#modalImg");
    const modalCaption = document.querySelector("#modalCaption");

    function rebuild() {
      const rows = plantRows;
      const photos = photoRows;
      const logMap = combinedMilestonesByPlant(milestoneRows);
      const photoMap = new Map();
      photos.forEach(ph => {
        if (!photoMap.has(ph.plant_id)) photoMap.set(ph.plant_id, []);
        photoMap.get(ph.plant_id).push(ph);
      });
      plants = rows.map(p => ({
        ...p,
        photos: (photoMap.get(p.id) || []).sort((a,b) => sortNatural(a.date + a.type, b.date + b.type)),
        logs: logMap.get(p.id) || []
      })).sort((a,b) => sortNatural(a.name, b.name));

      typeFilter.innerHTML = '<option value="">Alla pelargontyper</option>';
      [...new Set(plants.map(p => clean(p.type)).filter(Boolean))]
        .sort((a,b) => a.localeCompare(b, "sv"))
        .forEach(type => {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = displayChipLabel(type);
          typeFilter.appendChild(option);
        });

      photoTypeFilter.innerHTML = '<option value="">Alla bildtyper</option>';
      [...new Set(plants.flatMap(p => p.photos || []).map(photo => normalizedPhotoType(photo.type)).filter(Boolean))]
        .sort((a,b) => a.localeCompare(b, "sv"))
        .forEach(type => {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = displayPhotoTypeLabel(type);
          photoTypeFilter.appendChild(option);
        });
      render();
    }

    function photoButtons(p, activeFile) {
      if ((p.photos || []).length <= 1) return "";
      const displayLabel = plantDisplayLabel(p);
      return p.photos.map(photo => `
        <button class="thumb ${photo.file === activeFile ? "active" : ""}" type="button"
          data-plant="${escapeAttr(displayLabel)}" data-file="${photo.file}" data-label="${escapeAttr(photo.label || (photo.date + " · " + photo.type))}">
          <img src="${photo.file}" alt="${escapeAttr(displayLabel + " " + photo.date)}" loading="lazy">
        </button>`).join("");
    }
    function displayChipLabel(label) {
      const raw = clean(label);
      const map = {
        "Vildpelargon": "Vild",
        "Vildart": "Vild",
        "Doftpelargon": "Doft",
        "Zonalpelargon": "Zonal",
        "Brokbladig pelargon": "Brokbladig"
      };
      return map[raw] || raw;
    }

    function displayPhotoTypeLabel(type) {
      const raw = normalizedPhotoType(type);
      if (raw === "hel") return "Hel växt";
      return raw ? raw.charAt(0).toLocaleUpperCase("sv") + raw.slice(1) : "";
    }

    function normalizedPhotoType(type) {
      return clean(type).toLocaleLowerCase("sv");
    }

    function photosMatchingSelectedType(p) {
      const photos = p.photos || [];
      const selectedPhotoType = normalizedPhotoType(photoTypeFilter.value);
      return selectedPhotoType
        ? photos.filter(photo => normalizedPhotoType(photo.type) === selectedPhotoType)
        : photos;
    }

    function splitTags(tags) {
      return clean(tags).split(";")
        .map(t => t.trim())
        .filter(Boolean);
    }

    function cardChips(p) {
      return collectionChipHtml("Pelargon", p, escapeAttr);
    }

    function cardTemplate(p) {
      const displayName = plantDisplayName(p);
      const identity = plantIdentityName(p);
      const displayLabel = plantDisplayLabel(p);
      const collectionName = p.collection_id ? clean(plants.find(row => row.id === p.collection_id)?.name) : "";
      const photos = p.photos || [];
      const matchingPhotos = photosMatchingSelectedType(p);
      const active = matchingPhotos[matchingPhotos.length - 1] || photos[photos.length - 1] || {};
      const activeFile = active.file || "";
      const activeLabel = active.label || (active.date ? `${active.date} · ${active.type}` : "");
      const latestMilestone = latestPlantMilestone(p.logs);
      const gallery = photos.map(photo => {
        const label = photo.label || (photo.date + " · " + photo.type);
        return {file: photo.file, title: displayName, caption: `${displayLabel} · ${label}`, alt: displayLabel};
      });
      const searchable = [
        p.id, p.name, p.nickname, p.type, p.tags, p.status, p.scent, p.source, p.notes, getPlantCardNote(p.id, p.card_note, p.card_note_updated_at),
        ...photos.map(x => `${x.date} ${x.type} ${x.file}`),
        ...(p.logs || []).map(x => `${x.date} ${x.type} ${x.note}`)
      ].join(" ").toLowerCase();

      return `
        <article class="plant-card" data-search="${escapeAttr(searchable)}" data-type="${escapeAttr(p.type)}" data-status="${escapeAttr(p.status)}" data-category="Pelargon" data-record-kind="${escapeAttr(p.record_kind)}" data-plant-id="${escapeAttr(p.id)}" data-plant-name="${escapeAttr(displayName)}" data-plant-identity="${escapeAttr(identity)}" data-plant-nickname="${escapeAttr(p.nickname)}" data-card-image="${escapeAttr(p.card_image)}" data-card-crop-x="${escapeAttr(p.card_crop_x)}" data-card-crop-y="${escapeAttr(p.card_crop_y)}" data-card-image-updated-at="${escapeAttr(p.card_image_updated_at)}" data-cuttings-available="${escapeAttr(p.cuttings_available)}" data-cuttings-updated-at="${escapeAttr(p.cuttings_updated_at)}" data-gallery="${escapeAttr(JSON.stringify(gallery))}" data-milestones="${escapeAttr(JSON.stringify(p.logs || []))}">
          <div class="image-wrap">
            ${activeFile ? `<img class="main-photo" src="${activeFile}" alt="${escapeAttr(displayLabel)}" data-caption="${escapeAttr(displayLabel + " · " + activeLabel)}">` : ""}
            ${activeLabel ? `<div class="date-ribbon">${activeLabel}</div>` : ""}
            <div class="plant-card-gallery-slot ${photos.length > 1 ? "has-gallery" : ""}">${photos.length > 1 ? `<div class="thumbs">${photoButtons(p, activeFile)}</div>` : ""}</div>
          </div>
          <div class="card-body">
            <div class="plant-card-head">
              <div class="plant-title-block">${plantHeadingHtml(p, "", clean(p.record_kind).toUpperCase() === "INDIVIDUAL")}</div>
              <div class="import-actions">
                <button class="plant-log-btn" type="button" aria-label="Växtpanel" title="Växtpanel">${logBookIcon()}</button>
                <button class="add-photo-btn" type="button" aria-label="Lägg till bild" title="Lägg till bild">${cameraLineIcon()}</button>
                <span class="import-badge" data-import-badge hidden></span>
              </div>
            </div>
            <div class="plant-card-chip-slot"><div class="chips">${cardChips(p)}</div></div>
            <div class="plant-card-info">${collectionRecordInfoHtml(p, collectionName)}</div>
            <div class="plant-card-milestone-slot">${milestoneSummary(latestMilestone)}</div>
            <div class="plant-card-notes-slot">${plantCardNoteField(p.id, p.card_note, p.card_note_updated_at)}</div>
          </div>
        </article>
      `;
    }

    function latestDate(p) {
      return photosMatchingSelectedType(p).map(photo => photo.date).filter(Boolean).sort().at(-1) || "";
    }

    function sortedPlants(list) {
      return [...list].sort((a, b) => {
        const kindOrder = (clean(a.record_kind).toUpperCase() === "INDIVIDUAL" ? 0 : 1)
          - (clean(b.record_kind).toUpperCase() === "INDIVIDUAL" ? 0 : 1);
        if (kindOrder) return kindOrder;
        if (sortSelect.value === "type") {
          return sortNatural(clean(a.type) + a.name, clean(b.type) + b.name);
        }
        if (sortSelect.value === "latest") {
          return sortNatural(latestDate(b), latestDate(a)) || sortNatural(a.name, b.name);
        }
        if (sortSelect.value === "photos") {
          return (photosMatchingSelectedType(b).length - photosMatchingSelectedType(a).length) || sortNatural(a.name, b.name);
        }
        return sortNatural(a.name, b.name);
      });
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const selectedType = typeFilter.value === "__concluded_only__" ? "" : typeFilter.value;
      const selectedPhotoType = normalizedPhotoType(photoTypeFilter.value);
      const filtered = plants.filter(p => {
        const combined = [
          p.id, p.name, p.nickname, p.type, p.tags, p.status, p.scent, p.source, p.notes, getPlantCardNote(p.id, p.card_note, p.card_note_updated_at),
          ...(p.photos || []).map(x => `${x.date} ${x.type} ${x.file}`),
          ...(p.logs || []).map(x => `${x.date} ${x.type} ${x.note}`)
        ].join(" ").toLowerCase();
        return (!query || combined.includes(query))
          && (!selectedType || p.type === selectedType)
          && (!selectedPhotoType || photosMatchingSelectedType(p).length > 0);
      });
      const visible = sortedPlants(filtered);
      grid.innerHTML = visible.length ? visible.map(cardTemplate).join("") : '<div class="empty">Inga pelargoner matchar sökningen just nu.</div>';
      updatePlantImageImportUI();
      updatePlantFavoriteUI();
      const photoCount = plants.reduce((sum, p) => sum + (p.photos || []).length, 0);
      const withPhoto = plants.filter(p => (p.photos || []).length > 0).length;
      const collections = plants.filter(p => clean(p.record_kind).toUpperCase() === "COLLECTION");
      const individuals = plants.filter(p => clean(p.record_kind).toUpperCase() === "INDIVIDUAL");
      const specimenCount = collections.reduce((sum, p) => sum + (Number.parseInt(p.specimen_count, 10) || 0), 0);
      const activeParts = [
        query ? `Sökning: “${search.value.trim()}”` : "",
        selectedType ? `Typ: ${displayChipLabel(selectedType)}` : "",
        selectedPhotoType ? `Bildtyp: ${displayPhotoTypeLabel(selectedPhotoType)}` : "",
        `Sortering: ${sortSelect.options[sortSelect.selectedIndex].textContent}`
      ].filter(Boolean);
      stats.innerHTML = `
        <span class="stat">${collections.length} sorter/arter</span>
        <span class="stat">${individuals.length} ${individuals.length === 1 ? "individ" : "individer"}</span>
        <span class="stat">${specimenCount} exemplar</span>
        <span class="stat">${withPhoto} med bild</span>
        <span class="stat">${photoCount} bilder</span>
        <span class="stat">${visible.length} visas just nu</span>
        <span class="stat">${activeParts.join(" · ")}</span>
      `;
    }

    grid.addEventListener("click", event => {
      const thumb = event.target.closest(".thumb");
      const main = event.target.closest(".main-photo");
      if (thumb) {
        const card = thumb.closest(".plant-card");
        const img = card.querySelector(".main-photo");
        const ribbon = card.querySelector(".date-ribbon");
        card.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
        thumb.classList.add("active");
        img.src = thumb.dataset.file;
        img.dataset.caption = `${thumb.dataset.plant} · ${thumb.dataset.label}`;
        ribbon.textContent = thumb.dataset.label;
      }
      if (main) {
        openPlantPhotoGallery(main);
      }
    });
    ensurePlantPhotoGallery();
    ensurePlantMilestones();
    ensurePlantImageImport();
    ensurePlantFavorites();
    clearBtn.addEventListener("click", () => {
      search.value = "";
      typeFilter.value = "";
      photoTypeFilter.value = "";
      sortSelect.value = "name";
      render();
    });
    search.addEventListener("input", render);
    typeFilter.addEventListener("change", render);
    photoTypeFilter.addEventListener("change", render);
    sortSelect.addEventListener("change", render);
    window.addEventListener("plant-milestone-added", rebuild);
    rebuild();
    }
  </script>
  <script>
    const PUBLIC_CATALOG_SCHEMA_VERSION = 1;

    function showCatalogLoadError() {
      document.querySelector("#stats").textContent = "Katalogdata kunde inte hämtas.";
      document.querySelector("#grid").innerHTML = '<div class="empty" role="alert">Katalogdata kunde inte hämtas. Kontrollera anslutningen och uppdatera sidan.</div>';
      document.querySelectorAll(".toolbar input, .toolbar select, .toolbar button").forEach(control => {
        control.disabled = true;
      });
    }

    function validatePublicCatalog(snapshot, version) {
      const pelargon = snapshot && snapshot.categories && snapshot.categories.Pelargon;
      if (!snapshot || snapshot.schemaVersion !== PUBLIC_CATALOG_SCHEMA_VERSION
        || snapshot.catalogVersion !== version
        || !pelargon || !Array.isArray(pelargon.plants) || !Array.isArray(pelargon.photos)
        || !Array.isArray(snapshot.milestones) || !Array.isArray(snapshot.documents)) {
        throw new Error("Ogiltig offentlig katalogsnapshot.");
      }
      return snapshot;
    }

    async function loadPublicCatalog() {
      const versionResponse = await fetch("version.json", {cache: "no-store"});
      if (!versionResponse.ok) throw new Error("Kunde inte läsa version.json.");
      const versionPayload = await versionResponse.json();
      const version = typeof versionPayload.version === "string" ? versionPayload.version.trim() : "";
      if (!version) throw new Error("version.json saknar versionsnummer.");

      const catalogResponse = await fetch(`public-data/catalog.json?v=${encodeURIComponent(version)}`);
      if (!catalogResponse.ok) throw new Error("Kunde inte läsa public-data/catalog.json.");
      return validatePublicCatalog(await catalogResponse.json(), version);
    }

    (async function initialiseCatalog() {
      try {
        const snapshot = await loadPublicCatalog();
        window.publicCatalogSnapshot = snapshot;
        startPelargonPage(snapshot);
      } catch (error) {
        console.error("Kunde inte starta pelargonkatalogen.", error);
        showCatalogLoadError();
      }
    })();
  </script>
</body>
</html>
