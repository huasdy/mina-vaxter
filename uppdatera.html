<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uppdatera Mina Växter</title>
  <style>
    :root { --bg: #f5f1ea; --paper: #fffdf8; --ink: #2b251f; --line: #ded2c2; --accent: #7d4f3b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 440px); padding: 28px; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; }
    h1 { margin: 0; font: 500 2.2rem/1 Georgia, "Times New Roman", serif; }
    p { margin: 12px 0 22px; line-height: 1.45; color: #6f655b; }
    button { border: 0; border-radius: 999px; padding: 13px 18px; background: var(--accent); color: white; font: 800 1rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Uppdatera Mina Växter</h1>
    <p>Detta hämtar den senaste appversionen. Dina ändringar i synkkön påverkas inte.</p>
    <button id="update" type="button">Hämta senaste versionen</button>
  </main>
  <script>
    document.querySelector("#update").addEventListener("click", async () => {
      const button = document.querySelector("#update");
      button.disabled = true;
      button.textContent = "Uppdaterar…";
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if ("caches" in window) {
        const names = await caches.keys();
        await Promise.all(names.filter(name => name.startsWith("mina-vaxter-offline-")).map(name => caches.delete(name)));
      }
      location.replace(`iphone.html?uppdaterad=${Date.now()}`);
    });
  </script>
</body>
</html>
