    :root {

    * { box-sizing: border-box; }

      margin: 0; color: var(--ink); line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(125,79,59,.10), transparent 35rem),
                  radial-gradient(circle at top right, rgba(96,119,97,.12), transparent 30rem), var(--bg);
    }
    header { padding: 46px 22px 30px; text-align: center; }
    nav { margin-bottom: 18px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 750; }
    nav a.current { color: var(--ink); }
    .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; color: var(--accent); font-weight: 800; }
    h1 { margin: 8px 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem, 8vw, 5.6rem); line-height: .92; font-weight: 500; }
    .subtitle { margin: 0 auto; max-width: 720px; color: var(--muted); font-size: 1.05rem; }
    main { max-width: 1240px; margin: 0 auto; padding: 20px 18px 64px; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .toolbar input {
      width: min(430px, 100%); border: 1px solid var(--line); border-radius: 999px; padding: 11px 15px;
      background: var(--paper); color: var(--ink); font: inherit;
    }
    .stats { color: var(--muted); font-weight: 750; margin-left: auto; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 18px; align-items: start; }
    .plant-card { background: var(--paper); border: 1px solid rgba(222,210,194,.95); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .image-wrap { position: relative; aspect-ratio: 4 / 5; background: linear-gradient(135deg, rgba(125,79,59,.16), rgba(96,119,97,.14)), #eadfce; overflow: hidden; }
    .image-wrap > img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .image-empty { height: 100%; display: grid; place-items: center; color: var(--muted); font-weight: 800; }
    .date-ribbon { position: absolute; left: 12px; bottom: 12px; background: rgba(43,37,31,.76); color: white; border-radius: 999px; padding: 6px 10px; font-size: .8rem; font-weight: 750; }
    .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; position: relative; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; line-height: 1.08; font-weight: 650; }
    .latin, .plant-nickname { margin-top: 4px; color: var(--muted); font-style: italic; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: .94rem; }
    dt { color: var(--muted); font-weight: 800; }
    dd { margin: 0; }
    .empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 20px; padding: 34px; background: rgba(255,253,248,.7); color: var(--muted); text-align: center; font-weight: 750; }
    @media (max-width: 700px) {
      header { padding-top: 28px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .stats { margin-left: 0; }
    }
  </style>

  <script>
    let catalog = {};
    let catalogReady = false;
    let logMap = combinedMilestonesByPlant(parseCSV(document.querySelector("#defaultMilestonesCSV").textContent));
    const grid = document.querySelector("#grid");
    const stats = document.querySelector("#stats");
    const search = document.querySelector("#search");

    function showCatalogLoadError() {
      stats.textContent = "Katalogen kunde inte laddas";
      grid.innerHTML = '<div class="empty">Katalogdata kunde inte hämtas. Kontrollera anslutningen och uppdatera sidan.</div>';
    }

    function snapshotToCatalog(snapshot) {
      const titleKeys = {Hibiskus: "id", Pelargon: "name", Citrus: "name", Udda: "name"};
      if (!snapshot || snapshot.schemaVersion !== 1 || !snapshot.categories || typeof snapshot.categories !== "object") {
        throw new Error("Katalogens format stöds inte.");
      }
      const result = {};
      for (const category of Object.keys(titleKeys)) {
        const section = snapshot.categories[category];
        if (!section || !Array.isArray(section.plants) || !Array.isArray(section.photos)) {
          throw new Error(`Katalogen saknar ${category}.`);
        }
        const photosByPlant = new Map();
        for (const photo of section.photos) {
          const plantId = clean(photo?.plant_id);
          if (!plantId) throw new Error(`Katalogen har en bild utan växt-ID i ${category}.`);
          const photos = photosByPlant.get(plantId) || [];
          photos.push(photo);
          photosByPlant.set(plantId, photos);
        }
        result[category] = {
          titleKey: titleKeys[category],
          photos: section.photos,
          rows: section.plants.map(plant => ({...plant, photos: photosByPlant.get(clean(plant.id)) || []}))
        };
      }
      return result;
    }

    async function loadPublicCatalog() {
      const versionResponse = await fetch("version.json", {cache: "no-store"});
      if (!versionResponse.ok) throw new Error("Kunde inte hämta katalogversionen.");
      const versionInfo = await versionResponse.json();
      const version = clean(versionInfo?.version);
      if (!version) throw new Error("Katalogversion saknas.");
      const catalogResponse = await fetch(`public-data/catalog.json?v=${encodeURIComponent(version)}`);
      if (!catalogResponse.ok) throw new Error("Kunde inte hämta katalogdata.");
      const snapshot = await catalogResponse.json();
      if (clean(snapshot?.catalogVersion) !== version) throw new Error("Katalogversionerna stämmer inte överens.");
      return snapshotToCatalog(snapshot);
    }

    function pageForCategory(category) {
      return {Hibiskus: "hibiskusar.html", Pelargon: "pelargoner.html", Citrus: "citrus.html", Udda: "udda.html"}[category] || "index.html";
    }

    function cuttingsCard(category, section, row) {
      const photos = row.photos || [];
      const active = photos[photos.length - 1] || {};
      const identity = clean(row[section.titleKey]) || clean(row.id);
      const nickname = clean(row.nickname);
      const displayLabel = nickname ? `${identity} · ${nickname}` : identity;
      const logs = logMap.get(row.id) || [];
      const gallery = photos.map(photo => ({
        file: photo.file,
        title: identity,
        caption: `${displayLabel} · ${photo.label || photo.date || ""}`,
        alt: displayLabel
      }));
      const thumbs = photos.length > 1 ? `<div class="thumbs">${photos.map(photo => `
        <button class="thumb ${photo.file === active.file ? "active" : ""}" type="button" data-file="${escapeAttr(photo.file)}" data-label="${escapeAttr(photo.label || photo.date || "")}" aria-label="${escapeAttr(photo.label || photo.date || identity)}">
          <img src="${escapeAttr(photo.file)}" alt="">
        </button>`).join("")}</div>` : "";
      return `
        <article class="plant-card" data-category="${escapeAttr(category)}" data-plant-id="${escapeAttr(row.id)}" data-plant-name="${escapeAttr(identity)}" data-plant-identity="${escapeAttr(identity)}" data-plant-nickname="${escapeAttr(nickname)}" data-card-image="${escapeAttr(row.card_image)}" data-card-crop-x="${escapeAttr(row.card_crop_x)}" data-card-crop-y="${escapeAttr(row.card_crop_y)}" data-card-image-updated-at="${escapeAttr(row.card_image_updated_at)}" data-cuttings-available="${escapeAttr(row.cuttings_available)}" data-cuttings-updated-at="${escapeAttr(row.cuttings_updated_at)}" data-page="${escapeAttr(pageForCategory(category))}" data-gallery="${escapeAttr(JSON.stringify(gallery))}" data-milestones="${escapeAttr(JSON.stringify(logs))}">
          <div class="image-wrap">
            ${active.file ? `<img class="main-photo" src="${escapeAttr(active.file)}" alt="${escapeAttr(displayLabel)}" data-caption="${escapeAttr(displayLabel + " · " + (active.label || active.date || ""))}">` : '<div class="image-empty">Bild saknas</div>'}
            ${active.label || active.date ? `<div class="date-ribbon">${htmlEscape(active.label || active.date)}</div>` : ""}
            <div class="plant-card-gallery-slot ${photos.length > 1 ? "has-gallery" : ""}">${thumbs}</div>
          </div>
          <div class="card-body">
            <div class="plant-card-head">
              <div class="plant-title-block">${plantHeadingHtml(row, identity)}</div>
              <div class="import-actions">
                <button class="plant-log-btn" type="button" aria-label="Växtpanel" title="Växtpanel">${logBookIcon()}</button>
                <button class="add-photo-btn" type="button" aria-label="Lägg till bild" title="Lägg till bild">${cameraLineIcon()}</button>
                <span class="import-badge" data-import-badge hidden></span>
              </div>
            </div>
            <div class="plant-card-chip-slot"><div class="chips">${collectionChipHtml(category, row)}</div></div>
            <div class="plant-card-info"><dl><dt>ID</dt><dd>${htmlEscape(row.id)}</dd><dt>Kategori</dt><dd>${htmlEscape(category)}</dd></dl></div>
            <div class="plant-card-milestone-slot">${milestoneSummary(latestPlantMilestone(logs))}</div>
            <div class="plant-card-notes-slot">${plantCardNoteField(row.id, row.card_note, row.card_note_updated_at, category)}</div>
          </div>
        </article>`;
    }

    function render() {
      if (!catalogReady) return;
      const query = search.value.trim().toLocaleLowerCase("sv");
      const rows = Object.entries(catalog).flatMap(([category, section]) =>
        section.rows
          .filter(row => getPlantCuttingsStatus(row.id, row.cuttings_available, row.cuttings_updated_at))
          .map(row => ({category, section, row}))
      ).filter(item => !query || JSON.stringify(item.row).toLocaleLowerCase("sv").includes(query));
      stats.textContent = `${rows.length} ${rows.length === 1 ? "växt" : "växter"}`;
      grid.innerHTML = rows.length
        ? rows.map(item => cuttingsCard(item.category, item.section, item.row)).join("")
        : '<div class="empty">Inga sticklingar markerade ännu. Slå på Sticklingar i växtpanelen.</div>';
      updatePlantFavoriteUI();
      updatePlantImageImportUI();
    }

    grid.addEventListener("click", event => {
      const thumb = event.target.closest(".thumb");
      const main = event.target.closest(".main-photo");
      if (thumb) {
        const card = thumb.closest(".plant-card");
        const image = card.querySelector(".main-photo");
        if (image) {
          image.src = thumb.dataset.file;
          image.dataset.caption = `${image.alt} · ${thumb.dataset.label}`;
          card.querySelectorAll(".thumb").forEach(item => item.classList.toggle("active", item === thumb));
        }
      }
      if (main) openPlantPhotoGallery(main);
    });
    search.addEventListener("input", render);
    window.addEventListener("plant-status-changed", render);
    window.addEventListener("plant-milestone-added", () => {
      logMap = combinedMilestonesByPlant(parseCSV(document.querySelector("#defaultMilestonesCSV").textContent));
      render();
    });
    async function initialiseCatalog() {
      try {
        catalog = await loadPublicCatalog();
        catalogReady = true;
        ensurePlantPhotoGallery();
        ensurePlantMilestones();
        ensurePlantImageImport();
        ensurePlantFavorites();
        render();
      } catch (error) {
        console.error("Kunde inte ladda katalogdata.", error);
        showCatalogLoadError();
      }
    }
    initialiseCatalog();
  </script>
