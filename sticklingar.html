<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f5f1ea; --paper: #fffdf8; --ink: #2b251f; --muted: #6f655b;
      --line: #ded2c2; --accent: #7d4f3b; --chip: #efe6da;
      --shadow: 0 14px 40px rgba(62,43,28,.12); --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(125,79,59,.10), transparent 35rem),
                  radial-gradient(circle at top right, rgba(96,119,97,.12), transparent 30rem), var(--bg);
    }
    header { padding: 46px 22px 30px; text-align: center; }
    nav { margin-bottom: 18px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 750; }
    nav a.current { color: var(--ink); }
    .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; color: var(--accent); font-weight: 800; }
    h1 { margin: 8px 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem, 8vw, 5.6rem); line-height: .92; font-weight: 500; }
    .subtitle { margin: 0 auto; max-width: 720px; color: var(--muted); font-size: 1.05rem; }
    main { max-width: 1240px; margin: 0 auto; padding: 20px 18px 64px; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .toolbar input {
      width: min(430px, 100%); border: 1px solid var(--line); border-radius: 999px; padding: 11px 15px;
      background: var(--paper); color: var(--ink); font: inherit;
    }
    .stats { color: var(--muted); font-weight: 750; margin-left: auto; white-space: nowrap; }
    .manager { margin: 0; }
    .add-parent-btn { border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: var(--paper); color: var(--accent); font: inherit; font-weight: 800; cursor: pointer; }
    .add-parent-dialog { width: min(750px, 90vw); height: min(760px, calc(100vh - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); color: var(--ink); box-shadow: 0 24px 80px rgba(43,37,31,.28); }
    .add-parent-dialog::backdrop { background: rgba(43,37,31,.34); backdrop-filter: blur(2px); }
    .chooser-dialog-content { display: flex; height: 100%; max-height: min(760px, calc(100vh - 32px)); flex-direction: column; }
    .chooser-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .chooser-dialog-header h2 { margin: 0; color: var(--accent); font: 800 1.2rem/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chooser-close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--accent); font: 700 1.25rem/1 sans-serif; cursor: pointer; }
    .chooser { display: flex; min-height: 0; flex-direction: column; padding: 16px 20px 20px; overflow: hidden; }
    .chooser-categories { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
    .chooser-category { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; background: var(--paper); color: var(--accent); font: inherit; font-size: .88rem; font-weight: 800; cursor: pointer; }
    .chooser-category.active { background: var(--accent); border-color: var(--accent); color: white; }
    .chooser input { width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; background: var(--paper); color: var(--ink); font: inherit; }
    .chooser-list { display: grid; min-height: 0; flex: 1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; overflow: auto; padding: 1px; }
    .chooser-item { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 7px; background: var(--paper); color: var(--ink); cursor: pointer; font: inherit; }
    .chooser-item img, .chooser-empty-image { width: 48px; height: 48px; border-radius: 9px; object-fit: cover; background: var(--chip); }

    .chooser-empty { color: var(--muted); padding: 12px 2px 2px; }
    .manage-btn { border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: var(--paper); color: var(--accent); font: inherit; font-weight: 800; cursor: pointer; }
    .cuttings-page .plant-card { height: auto !important; min-height: 0 !important; position: relative; }

    .cuttings-page .plant-card .card-body { height: auto !important; min-height: 0 !important; display: block !important; flex: 0 0 auto !important; grid-template-rows: none !important; align-content: initial !important; gap: 0 !important; }

  <script>
    let catalog = {};
    let catalogReady = false;
    let logMap = combinedMilestonesByPlant(parseCSV(document.querySelector("#defaultMilestonesCSV").textContent));
    const grid = document.querySelector("#grid");
    const stats = document.querySelector("#stats");
    const search = document.querySelector("#search");
    const chooserSearch = document.querySelector("#chooserSearch");
    const chooserList = document.querySelector("#chooserList");
    const chooserCategories = document.querySelector("#chooserCategories");
    const addParentBtn = document.querySelector("#addParentBtn");
    const addParentDialog = document.querySelector("#addParentDialog");
    const closeParentDialog = document.querySelector("#closeParentDialog");
    const manageBtn = document.querySelector("#manageBtn");
    let manageMode = false;
    const chooserCategoryNames = ["Alla", "Hibiskus", "Pelargon", "Citrus", "Udda", "Stapeliader"];
    let chooserCategory = "Alla";

    function showCatalogLoadError() {
      stats.textContent = "Katalogen kunde inte laddas";
      grid.innerHTML = '<div class="empty">Katalogdata kunde inte hämtas. Kontrollera anslutningen och uppdatera sidan.</div>';
    }

    function snapshotToCatalog(snapshot) {
      const titleKeys = {Hibiskus: "id", Pelargon: "name", Citrus: "name", Udda: "name", Stapeliader: "short_name"};
      if (!snapshot || snapshot.schemaVersion !== 4 || !snapshot.categories || typeof snapshot.categories !== "object") {
        throw new Error("Katalogens format stöds inte.");
      }
      const result = {};
      for (const category of Object.keys(titleKeys)) {
        const section = snapshot.categories[category];
        if (!section || !Array.isArray(section.plants) || !Array.isArray(section.photos)) {
          throw new Error(`Katalogen saknar ${category}.`);
        }
        const photosByPlant = new Map();
        for (const photo of section.photos) {
          const plantId = clean(photo?.plant_id);
          if (!plantId) throw new Error(`Katalogen har en bild utan växt-ID i ${category}.`);
          const photos = photosByPlant.get(plantId) || [];
          photos.push(photo);
          photosByPlant.set(plantId, photos);
        }
        result[category] = {
          titleKey: titleKeys[category],
          photos: section.photos,
          rows: section.plants.map(plant => ({...plant, photos: photosByPlant.get(clean(plant.id)) || []}))
        };
      }
      return result;
    }

    async function loadPublicCatalog() {
      const versionResponse = await fetch("version.json", {cache: "no-store"});
      if (!versionResponse.ok) throw new Error("Kunde inte hämta katalogversionen.");
      const versionInfo = await versionResponse.json();
      const version = clean(versionInfo?.version);
      if (!version) throw new Error("Katalogversion saknas.");
      const catalogResponse = await fetch(`public-data/catalog.json?v=${encodeURIComponent(version)}`);
      if (!catalogResponse.ok) throw new Error("Kunde inte hämta katalogdata.");
      const snapshot = await catalogResponse.json();
      if (clean(snapshot?.catalogVersion) !== version) throw new Error("Katalogversionerna stämmer inte överens.");
      return snapshotToCatalog(snapshot);
    }

    function pageForCategory(category) {
      return {Hibiskus: "hibiskusar.html", Pelargon: "pelargoner.html", Citrus: "citrus.html", Udda: "udda.html", Stapeliader: "stapeliader.html"}[category] || "index.html";
    }

    function cuttingsCard(category, section, row) {
      const photos = row.photos || [];
      const active = photos[photos.length - 1] || {};
      const identity = clean(row[section.titleKey]) || clean(row.id);
      const nickname = clean(row.nickname);
      const displayLabel = nickname ? `${identity} · ${nickname}` : identity;
      const logs = logMap.get(row.id) || [];
      const gallery = photos.map(photo => ({
        file: photo.file,
        title: identity,
        caption: `${displayLabel} · ${photo.label || photo.date || ""}`,
        alt: displayLabel
      }));
      const thumbs = photos.length > 1 ? `<div class="thumbs">${photos.map(photo => `
        <button class="thumb ${photo.file === active.file ? "active" : ""}" type="button" data-file="${escapeAttr(photo.file)}" data-label="${escapeAttr(photo.label || photo.date || "")}" aria-label="${escapeAttr(photo.label || photo.date || identity)}">
          <img src="${escapeAttr(photo.file)}" alt="">
        </button>`).join("")}</div>` : "";
      return `
        <article class="plant-card" data-category="${escapeAttr(category)}" data-plant-id="${escapeAttr(row.id)}" data-plant-name="${escapeAttr(identity)}" data-plant-identity="${escapeAttr(identity)}" data-plant-nickname="${escapeAttr(nickname)}" data-card-image="${escapeAttr(row.card_image)}" data-card-crop-x="${escapeAttr(row.card_crop_x)}" data-card-crop-y="${escapeAttr(row.card_crop_y)}" data-card-image-updated-at="${escapeAttr(row.card_image_updated_at)}" data-cuttings-available="${escapeAttr(row.cuttings_available)}" data-cuttings-updated-at="${escapeAttr(row.cuttings_updated_at)}" data-page="${escapeAttr(pageForCategory(category))}" data-gallery="${escapeAttr(JSON.stringify(gallery))}" data-milestones="${escapeAttr(JSON.stringify(logs))}">
          <div class="image-wrap">
            ${active.file ? `<img class="main-photo" src="${escapeAttr(active.file)}" alt="${escapeAttr(displayLabel)}" data-caption="${escapeAttr(displayLabel + " · " + (active.label || active.date || ""))}">` : '<div class="image-empty">Bild saknas</div>'}
          </div>
          <div class="card-body">
            ${plantHeadingHtml(row, identity, category === "Pelargon")}
            <button class="cuttings-remove" type="button" data-remove-cuttings="${escapeAttr(row.id)}" data-remove-category="${escapeAttr(category)}">Ta bort</button>
          </div>
        </article>`;
    }

    function render() {
      if (!catalogReady) return;
      const query = search.value.trim().toLocaleLowerCase("sv");
      const rows = Object.entries(catalog).flatMap(([category, section]) =>
        section.rows
          .filter(row => getPlantCuttingsStatus(row.id, row.cuttings_available, row.cuttings_updated_at)
            && !plantStatusRemovesFromActiveCollection(row.status)
            && !isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || [])))
          .map(row => ({category, section, row}))
      ).filter(item => !query || JSON.stringify(item.row).toLocaleLowerCase("sv").includes(query));
      stats.textContent = `${rows.length} ${rows.length === 1 ? "växt" : "växter"}`;
      grid.innerHTML = rows.length
        ? rows.map(item => cuttingsCard(item.category, item.section, item.row)).join("")
        : '<div class="empty">Inga moderplantor är markerade ännu. Lägg till en moderplanta ovan.</div>';
      updatePlantFavoriteUI();
      grid.querySelectorAll(".favorite-corner").forEach(button => button.remove());
      updatePlantImageImportUI();
    }

    function chooserLabel(category, section, row) {
      const identity = clean(row[section.titleKey]) || clean(row.id);
      const nickname = clean(row.nickname);
      const primary = category === "Pelargon" && nickname ? nickname : identity;
      const identifier = clean(row.label_number) || clean(row.id);
      return { identity, display: primary, identifier };
    }

    function renderChooserCategories() {
      chooserCategories.innerHTML = chooserCategoryNames.map(category =>
        `<button class="chooser-category ${chooserCategory === category ? "active" : ""}" type="button" data-chooser-category="${escapeAttr(category)}" aria-pressed="${chooserCategory === category}">${htmlEscape(category === "Stapeliader" ? "Stapelia" : category)}</button>`
      ).join("");
    }

    function renderChooser() {
      if (!catalogReady) return;
      const query = chooserSearch.value.trim().toLocaleLowerCase("sv");
      renderChooserCategories();
      if (chooserCategory === "Alla" && !query) {
        chooserList.innerHTML = '<div class="chooser-empty">Välj en kategori eller börja skriva för att söka.</div>';
        return;
      }
      const candidates = Object.entries(catalog).flatMap(([category, section]) => section.rows
        .filter(row => (chooserCategory === "Alla" || category === chooserCategory)
          && !getPlantCuttingsStatus(row.id, row.cuttings_available, row.cuttings_updated_at)
          && !plantStatusRemovesFromActiveCollection(row.status)
          && !isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || [])))
        .map(row => ({category, section, row, label: chooserLabel(category, section, row)})))
        .filter(item => !query || `${item.category} ${item.label.display} ${item.label.identifier} ${JSON.stringify(item.row)}`.toLocaleLowerCase("sv").includes(query));
      chooserList.innerHTML = candidates.length ? candidates.map(item => {
        const image = (item.row.photos || []).at(-1)?.file || item.row.card_image;
        return `<button class="chooser-item" type="button" data-add-cuttings="${escapeAttr(item.row.id)}" data-add-category="${escapeAttr(item.category)}">
          ${image ? `<img src="${escapeAttr(image)}" alt="">` : '<span class="chooser-empty-image" aria-hidden="true"></span>'}
          <span><strong>${htmlEscape(item.label.display)}</strong><small>${htmlEscape(item.label.identifier)}</small></span>
        </button>`;
      }).join("") : '<div class="chooser-empty">Ingen omarkerad växt matchar sökningen.</div>';
    }

    function handleCuttingsChooserClick(event) {
      const add = event.target.closest("[data-add-cuttings]");
      if (add) {
        setPlantCuttingsStatus(add.dataset.addCuttings, add.dataset.addCategory, true);
        addParentDialog.close();
      }
    }

    grid.addEventListener("click", event => {
      const card = event.target.closest(".plant-card");
      const thumb = event.target.closest(".thumb");
      const main = event.target.closest(".main-photo");
      if (thumb) {
        const card = thumb.closest(".plant-card");
        const image = card.querySelector(".main-photo");
        if (image) {
          image.src = thumb.dataset.file;
          image.dataset.caption = `${image.alt} · ${thumb.dataset.label}`;
          card.querySelectorAll(".thumb").forEach(item => item.classList.toggle("active", item === thumb));
        }
      }
      const remove = event.target.closest("[data-remove-cuttings]");
      if (remove) setPlantCuttingsStatus(remove.dataset.removeCuttings, remove.dataset.removeCategory, false);
      if (card && !event.target.closest("button, input, a") && !manageMode) openPlantPanel(card);
    });
    chooserList.addEventListener("click", handleCuttingsChooserClick);
    chooserCategories.addEventListener("click", event => {
      const category = event.target.closest("[data-chooser-category]");
      if (!category) return;
      chooserCategory = category.dataset.chooserCategory;
      renderChooser();
    });
    search.addEventListener("input", render);
    chooserSearch.addEventListener("input", renderChooser);
    addParentBtn.addEventListener("click", () => { renderChooser(); addParentDialog.showModal(); });
    closeParentDialog.addEventListener("click", () => addParentDialog.close());
    addParentDialog.addEventListener("click", event => { if (event.target === addParentDialog) addParentDialog.close(); });
    manageBtn.addEventListener("click", () => {
      manageMode = !manageMode;
      document.body.classList.toggle("manage-mode", manageMode);
      manageBtn.textContent = manageMode ? "Klar" : "Hantera";
    });
    window.addEventListener("plant-status-changed", render);
    window.addEventListener("plant-status-changed", renderChooser);
    window.addEventListener("plant-milestone-added", () => {
      logMap = combinedMilestonesByPlant(parseCSV(document.querySelector("#defaultMilestonesCSV").textContent));
      render();
    });
    async function initialiseCatalog() {
      try {
        catalog = await loadPublicCatalog();
        catalogReady = true;
        ensurePlantPhotoGallery();
        ensurePlantMilestones();
        ensurePlantImageImport();
        ensurePlantFavorites();
        render();
        renderChooser();
      } catch (error) {
        console.error("Kunde inte ladda katalogdata.", error);
        showCatalogLoadError();
      }
    }
    initialiseCatalog();
  </script>
</body>
</html>
