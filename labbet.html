<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labbet · Mina Växter</title>
  <meta name="theme-color" content="#f5f1ea">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="labbet.css?v=1f612ebd447b">
</head>
<body>
  <header class="page-header">
    <nav data-main-navigation aria-label="Huvudnavigation"></nav>
    <div class="eyebrow">Förädling och frösådd</div>
    <h1>Labbet</h1>
    <p class="subtitle">Från frö och korsning till urval.</p>
  </header>

  <main>
    <section class="lab-controls" aria-label="Filtrera Labbet">
      <div class="control-row">
        <div class="filter-heading">
          <div class="pill-group" id="speciesFilters" role="group" aria-label="Artfilter">
            <button type="button" data-species="Alla" class="active" aria-pressed="true">Alla</button>
            <button type="button" data-species="Hibiskus" aria-pressed="false">Hibiskus</button>
            <button type="button" data-species="Pelargon" aria-pressed="false">Pelargon</button>
            <button type="button" data-species="Stapelia" aria-pressed="false">Stapelia</button>
            <button type="button" data-species="Udda" aria-pressed="false">Udda</button>
          </div>
          <button type="button" class="primary-action" id="newLabItem">+ Nytt</button>
        </div>
      </div>
    </section>

    <section id="labPortal" class="stats-grid lab-portal" aria-label="Labbet huvudnavigation">
      <button type="button" class="stat-card is-active" data-lab-view="froer" aria-pressed="true">
        <strong data-portal-count="froer">—</strong><span>Fröer</span><small data-portal-secondary="froer">Fröpåsar med saldo</small>
      </button>
      <button type="button" class="stat-card" data-lab-view="korsningar" aria-pressed="false">
        <strong data-portal-count="korsningar">—</strong><span>Korsningar</span><small data-portal-secondary="korsningar"></small>
      </button>
      <button type="button" class="stat-card" data-lab-view="sadder" aria-pressed="false">
        <strong data-portal-count="sadder">—</strong><span>Sådder</span><small data-portal-secondary="sadder"></small>
      </button>
      <button type="button" class="stat-card" data-lab-view="uppdragning" data-portal-status="Under uppdragning" aria-pressed="false">
        <strong data-portal-count="uppdragning">—</strong><span>Under uppdragning</span><small data-portal-secondary="uppdragning"></small>
      </button>
      <button type="button" class="stat-card" data-lab-view="uppdragning" data-portal-status="Redo för bedömning" aria-pressed="false">
        <strong data-portal-count="redo">—</strong><span>Redo för bedömning</span><small data-portal-secondary="redo"></small>
      </button>
    </section>

    <div id="labContent" class="lab-content" aria-live="polite">
      <div class="loading-card">Laddar Labbet…</div>
    </div>
  </main>

  <dialog id="infoDialog" class="info-dialog">
    <div class="dialog-panel">
      <button class="dialog-close" type="button" data-dialog-close aria-label="Stäng">×</button>
      <div id="infoDialogContent"></div>
    </div>
  </dialog>

  <div id="seedPrintMenu" class="seed-print-menu" role="menu" aria-label="Skriv ut etikett" hidden></div>
  <div id="seedPrintArea" class="seed-print-area" aria-hidden="true"></div>

  <script src="main-navigation.js?v=7b1a2b0f9f81"></script>
  <script src="common.js?v=2fbf338fa390"></script>
  <script src="labbet.js?v=1f220a2f8c42"></script>
</body>
</html>
