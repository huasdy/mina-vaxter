<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hibiskus</title>
  <style>
    :root {
      --bg: #f5f1ea; --paper: #fffdf8; --ink: #2b251f; --muted: #6f655b;
      --line: #ded2c2; --accent: #7d4f3b; --chip: #efe6da;
      --shadow: 0 14px 40px rgba(62, 43, 28, 0.12); --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(125,79,59,0.10), transparent 35rem),
                  radial-gradient(circle at top right, rgba(96,119,97,0.10), transparent 30rem),
                  var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header { padding: 46px 22px 30px; text-align: center; }
    nav { margin-bottom: 18px; text-align: center; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 750; }
    nav a.current { color: var(--ink); }
    .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; color: var(--accent); font-weight: 800; }
    h1 { margin: 8px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem, 8vw, 5.6rem); line-height: .92; font-weight: 500; }
    .subtitle { margin: 0 auto; max-width: 860px; color: var(--muted); font-size: 1.05rem; }
    .toolbar {
      background: rgba(245,241,234,.84); border-top: 1px solid rgba(222,210,194,.75);
      border-bottom: 1px solid rgba(222,210,194,.95); padding: 14px 18px;
    }
    .toolbar-inner { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(220px, 1fr) repeat(7, auto); gap: 10px; align-items: center; }
    input, select, button, label.filebutton {
      border: 1px solid var(--line); background: var(--paper); border-radius: 999px; color: var(--ink);
      padding: 11px 14px; font-size: .95rem; font: inherit;
    }
    input[type="search"] { width: 100%; min-width: 0; }
    button, label.filebutton { cursor: pointer; background: var(--accent); color: white; border-color: var(--accent); font-weight: 750; white-space: nowrap; }
    button.secondary, label.filebutton.secondary { background: var(--paper); color: var(--accent); border-color: rgba(125,79,59,.35); }
    input[type="file"] { display: none; }
    main { max-width: 1240px; margin: 0 auto; padding: 26px 18px 64px; }
    .helpbox { max-width: 1240px; margin: 0 auto 18px; background: rgba(255,253,248,.78); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px; color: var(--muted); font-size: .92rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; color: var(--muted); }
    .stat { background: rgba(255,253,248,.74); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: .92rem; font-weight: 650; }
    .batch-log { background: rgba(255,253,248,.78); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 22px; box-shadow: var(--shadow); }
    .batch-log-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .batch-log h2 { font-size: 1.35rem; margin: 0 0 4px; }
    .batch-log-summary { color: var(--muted); font-size: .94rem; font-weight: 650; }
    .batch-log-toggle { background: var(--paper); color: var(--accent); border-color: rgba(125,79,59,.35); padding: 8px 12px; flex: 0 0 auto; }
    .batch-log-detail { display: grid; gap: 14px; margin-top: 14px; }
    .batch-log-detail[hidden] { display: none; }
    .batch-log-section h3 { margin: 0 0 7px; color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; }
    .batch-facts, .batch-log-list { display: grid; gap: 8px; }
    .batch-fact { color: var(--muted); font-weight: 650; }
    .batch-method { color: var(--muted); margin: 0; }
    .batch-log-item { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); }
    .batch-log-item:first-child { border-top: 0; padding-top: 0; }
    .batch-log-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; color: var(--ink); font-weight: 800; }
    .batch-log-id { color: var(--accent); }
    .batch-log-note { margin-top: 3px; }
    .bulk-milestone-dialog {
      width: min(94vw, 720px); max-height: 88vh; overflow: auto; border: 0; border-radius: 22px;
      padding: 0; background: var(--paper); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.26);
    }
    .bulk-milestone-dialog::backdrop { background: rgba(22,18,15,.50); }
    .bulk-panel { padding: 20px; display: grid; gap: 14px; }
    .bulk-panel header { padding: 0; text-align: left; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .bulk-panel h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 2rem; line-height: 1.02; }
    .bulk-panel p { margin: 5px 0 0; color: var(--muted); font-weight: 700; }
    .bulk-close {
      border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
      width: 42px; min-width: 42px; height: 42px; flex: 0 0 42px; padding: 0; display: grid; place-items: center; font-size: 1.4rem; line-height: 1; cursor: pointer;
    }
    .bulk-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; }
    .bulk-scope { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .bulk-scope label {
      color: var(--accent); text-transform: uppercase; letter-spacing: .12em;
      font-size: .72rem; font-weight: 900;
    }
    .bulk-fields input, .bulk-fields select, .bulk-scope select, .bulk-panel textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 10px 11px;
      background: var(--paper); color: var(--ink); font: inherit; font-weight: 750;
    }
    .bulk-panel textarea { min-height: 70px; resize: vertical; }
    .bulk-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .bulk-actions button { padding: 9px 12px; }
    .bulk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; max-height: 260px; overflow: auto; }
    .bulk-item { border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; color: var(--ink); font-weight: 800; background: rgba(255,255,255,.48); }
    .bulk-item input { width: auto; margin-right: 6px; }
    .bulk-submit { border: 0; border-radius: 999px; padding: 11px 15px; background: var(--accent); color: white; font: inherit; font-weight: 900; cursor: pointer; }
    .bulk-count { color: var(--muted); font-weight: 800; }
    body.tool-view .toolbar, body.tool-view .stats, body.tool-view .grid { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 18px; }
    .empty { grid-column: 1 / -1; background: rgba(255,253,248,.78); border: 1px solid var(--line); border-radius: 18px; padding: 24px; color: var(--muted); text-align: center; font-weight: 650; }
    .plant-card { background: var(--paper); border: 1px solid rgba(222,210,194,.95); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 100%; }
    .image-wrap { position: relative; aspect-ratio: 4 / 5; background: linear-gradient(135deg, rgba(125,79,59,.16), rgba(96,119,97,.14)), #eadfce; overflow: hidden; }
    .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .image-wrap img.main-photo[data-photo-type="blomma"] { object-position: center center; }
    .date-ribbon { position: absolute; left: 12px; bottom: 12px; background: rgba(43,37,31,.76); color: white; border-radius: 999px; padding: 6px 10px; font-size: .8rem; font-weight: 750; backdrop-filter: blur(8px); }
    .thumbs { display: flex; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
    .thumb { border: 2px solid transparent; background: transparent; padding: 0; border-radius: 12px; overflow: hidden; width: 58px; height: 58px; cursor: pointer; }
    .thumb.active { border-color: var(--accent); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; line-height: 1.08; font-weight: 650; }
    .plant-nickname { margin-top: -7px; color: var(--muted); font-style: italic; font-weight: 700; }
    .plant-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .score { min-width: 42px; text-align: center; border-radius: 999px; background: var(--chip); color: var(--muted); padding: 5px 9px; font-weight: 800; font-size: .85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: .8rem; font-weight: 700; }
    .chip.green { background: rgba(96,119,97,.17); color: #435943; }
    .chip.gold { background: rgba(181,138,69,.18); color: #77572a; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: .94rem; }
    dt { color: var(--muted); font-weight: 800; }
    dd { margin: 0; }
    .notes { color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; font-size: .94rem; min-height: 2.2em; }
    .parent-reference-module {
      border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px;
    }
    .parent-reference-head { display: flex; align-items: baseline; gap: 10px; }
    .parent-reference-title {
      color: var(--accent); text-transform: uppercase; letter-spacing: .12em;
      font-size: .72rem; font-weight: 900;
    }
    .parent-reference-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .parent-reference-item { min-width: 0; margin: 0; display: grid; gap: 6px; }
    .parent-reference-button {
      width: 100%; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 13px;
      padding: 0; overflow: hidden; background: white; cursor: zoom-in;
    }
    .parent-reference-button img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .parent-reference-caption { display: grid; gap: 2px; min-width: 0; }
    .parent-reference-caption strong { color: var(--ink); font-size: .86rem; }
    .parent-reference-caption span {
      color: var(--muted); font-size: .75rem; font-weight: 750;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .parent-reference-source { color: var(--muted); font-size: .76rem; line-height: 1.35; }
    .parent-reference-source a { color: var(--accent); font-weight: 850; }
    dialog { border: none; padding: 0; background: transparent; max-width: min(92vw, 1000px); max-height: 92vh; }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .modal-img { display: block; max-width: 100%; max-height: 88vh; border-radius: 18px; background: white; }
    .modal-caption { color: white; text-align: center; padding-top: 10px; font-weight: 700; }
    footer { text-align: center; color: var(--muted); padding: 26px 18px 44px; font-size: .92rem; }
    @media (max-width: 700px) {
      .image-wrap { aspect-ratio: auto; height: min(280px, 65vw); }
      .bulk-fields { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) { .toolbar-inner { grid-template-columns: 1fr; } select, button, label.filebutton { width: 100%; text-align: center; } }
</style>

  <script type="text/plain" id="defaultBreedingMarkersCSV">marker_id,assessment_id,slot,trait_id,label,selected_at</script>
  <script src="common.js?v=20260820synk0938"></script>
  <script src="hibiskus-george-import.js?v=20260814v1"></script>
  <script src="hibiskus-blombedomning.js?v=20260814v3"></script>
  <script>
    let plants = [];
    let plantCSVText = document.querySelector("#defaultPlantsCSV").textContent;
    let photoCSVText = document.querySelector("#defaultPhotosCSV").textContent;
    let milestoneCSVText = document.querySelector("#defaultMilestonesCSV").textContent;

    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const batchFilter = document.querySelector("#batchFilter");
    const subBatchFilter = document.querySelector("#subBatchFilter");
    const statusFilter = document.querySelector("#statusFilter");
    const markerFilter = document.querySelector("#markerFilter");
    const sortSelect = document.querySelector("#sortSelect");
    const clearBtn = document.querySelector("#clearBtn");
    const requestedTool = new URLSearchParams(window.location.search).get("tool");
    if (requestedTool) {
      document.body.classList.add("tool-view");
      const title = requestedTool === "frobatcher" ? "Fröbatcher" : "Milstolpar flera";
      document.title = title;
      document.querySelector("h1").textContent = title;
      document.querySelector(".subtitle").textContent = requestedTool === "frobatcher"
        ? "Översikt och historik för hibiskussådder."
        : "Spara samma permanenta händelse på flera hibiskusar.";
      document.querySelector('nav a[href="hibiskusar.html"]').classList.remove("current");
      document.querySelector('nav a[href="verktyg.html"]').classList.add("current");
    }
    const bulkMilestoneDialog = document.querySelector("#bulkMilestoneDialog");
    bulkMilestoneDialog.addEventListener("close", () => {
      if (requestedTool === "milstolpar") window.location.replace("verktyg.html");
    });
    const stats = document.querySelector("#stats");
    const batchLog = document.querySelector("#batchLog");
    let batchArchiveOpen = requestedTool === "frobatcher";
    let batchLogOpen = false;
    const hibiscusBatches = {
      "PL-H01": {
        title: "PL-H01 – första hibiskussådden",
        summary: "PL-H01 · Sådd 2025-11-16 · Rockwool/kuber · äldre ID-modell · 15 plantor omplanterade 2026-05-24",
        method: "Sådden gjordes i rockwool/kuber. Metoden fungerade, men kuberna upplevdes som svårare att hålla jämnt fuktiga och kunde torka snabbare än önskat.",
        facts: [
          "Äldre ID-modell: PL-H01-A betyder individuell planta",
          "15 plantor omplanterades 2026-05-24",
          "Registrerade plantor: PL-H01-A, PL-H01-B, PL-H01-C, PL-H01-D, PL-H01-G, PL-H01-H, PL-H01-I, PL-H01-J, PL-H01-K, PL-H01-L, PL-H01-M, PL-H01-N, PL-H01-O, PL-H01-Q, PL-H01-R"
        ],
        events: [
          {date: "2025-11-16", type: "Sådd", note: "Frö med okänd moder och fader såddes som den första hibiskusfröbatchen."},
          {date: "2026-05-24", type: "Omplantering", note: "15 plantor planterades om och började hanteras som individuella växter i katalogen."}
        ],
        lesson: "Rockwool/kuber kan fungera för hibiskusfrön, men kräver noggrann fuktkontroll. Erfarenheten blev jämförelsepunkt inför PL-H02."
      },
      "PL-H02": {
        title: "PL-H02 – andra hibiskussådden",
        summary: "PL-H02 · Sådd 2026-06-25 · Jord · undervärme ca 25 °C · första grodd 2026-07-06 · B, D grodda",
        method: "Sådd i jord med undervärme ca 25 °C. Djupare sådd än tidigare rockwool-försök. Fukten hålls främst via kapillärmatta, med mistning ovanifrån, för att undvika övervattning.",
        facts: [
          "PL-H02-A · 11 frön · okänd × okänd",
          "PL-H02-B · 6 frön · 012 × 030",
          "PL-H02-C · 6 frön · 030 × 041",
          "PL-H02-D · 6 frön · 012 × okänd"
        ],
        events: [
          {date: "2026-06-25", type: "Sådd", note: "PL-H02 såddes som fyra korsningar, totalt 29 frön från Rareplants.eu."},
          {date: "2026-07-06", type: "Första grodd", note: "Första grodd observerad. Korsning B och D har grott."}
        ],
        lesson: "Jord med undervärme och kapillärmatta gav en tydligare och mer lättskött metod än rockwool-försöket."
      }
    };
    function escapeText(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function subBatchForPlant(p) {
      const match = clean(p && p.id).match(/^(PL-H\d+-[A-Z])-\d+$/);
      return match ? match[1] : "";
    }

    function batchForPlant(p) {
      const match = clean(p && p.id).match(/^(PL-H\d{2})(?:-|$)/);
      return match ? match[1] : "";
    }

    function sownDateForLogs(logs) {
      return (logs || [])
        .filter(row => clean(row.type) === "Sådd" && clean(row.date))
        .map(row => clean(row.date))
        .sort((a, b) => sortNatural(a, b))[0] || "";
    }

    function subBatchLabels() {
      const labels = new Map();
      Object.values(hibiscusBatches).forEach(batch => {
        (batch.facts || []).forEach(fact => {
          const parts = clean(fact).split(" · ");
          if (/^PL-H\d+-[A-Z]$/.test(parts[0])) {
            labels.set(parts[0], parts[2] ? `${parts[0]} · ${parts[2]}` : parts[0]);
          }
        });
      });
      plants.forEach(p => {
        const subBatch = subBatchForPlant(p);
        if (subBatch && !labels.has(subBatch)) labels.set(subBatch, subBatch);
      });
      return labels;
    }

    function knownSubBatches(batch = "") {
      const labels = subBatchLabels();
      return [...labels.keys()]
        .filter(subBatch => !batch || subBatch.startsWith(`${batch}-`))
        .sort((a, b) => sortNatural(a, b));
    }

    function subBatchOptionHtml(batch = "", selected = "") {
      const labels = subBatchLabels();
      const options = knownSubBatches(batch);
      return [
        `<option value="">Alla korsningar</option>`,
        ...options.map(subBatch => `<option value="${escapeAttr(subBatch)}" ${subBatch === selected ? "selected" : ""}>${escapeText(labels.get(subBatch) || subBatch)}</option>`)
      ].join("");
    }

    function populateSubBatchFilter() {
      const selected = subBatchFilter.value;
      const options = knownSubBatches(batchFilter.value);
      subBatchFilter.innerHTML = subBatchOptionHtml(batchFilter.value, options.includes(selected) ? selected : "");
      subBatchFilter.disabled = !options.length;
    }

    function rebuild() {
      const rows = parseCSV(plantCSVText);
      const photos = parseCSV(photoCSVText);
      const logMap = combinedMilestonesByPlant(parseCSV(milestoneCSVText));
      const photoMap = new Map();
      photos.forEach(ph => {
        if (!photoMap.has(ph.plant_id)) photoMap.set(ph.plant_id, []);
        photoMap.get(ph.plant_id).push(ph);
      });
      plants = rows.map(p => {
        const logs = logMap.get(p.id) || [];
        return {
          ...p,
          batch: batchForPlant(p),
          sown: sownDateForLogs(logs),
          photos: (photoMap.get(p.id) || []).sort((a,b) => sortNatural(a.date + a.type, b.date + b.type)),
          logs
        };
      }).sort((a,b) => sortNatural(a.id, b.id));

      batchFilter.innerHTML = '<option value="">Alla fröbatcher</option>';
      [...new Set(plants.map(p => clean(p.batch)).filter(Boolean))]
        .sort((a,b) => sortNatural(a, b))
        .forEach(batch => {
          const option = document.createElement("option");
          option.value = batch;
          option.textContent = batch;
          batchFilter.appendChild(option);
        });
      populateSubBatchFilter();

      statusFilter.innerHTML = '<option value="">Alla statusar</option>';
      [...new Set(plants.map(p => clean(p.status)).filter(Boolean))]
        .sort((a,b) => a.localeCompare(b, "sv"))
        .forEach(status => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          statusFilter.appendChild(option);
        });
      const markerLabels = new Map();
      plants.forEach(p => {
        const signatures = window.hibiscusFlowerMarkerSignatures ? window.hibiscusFlowerMarkerSignatures(p.id) : [];
        const holder = document.createElement("div");
        holder.innerHTML = window.hibiscusFlowerMarkerHtml ? window.hibiscusFlowerMarkerHtml(p.id, escapeText) : "";
        const labels = [...holder.querySelectorAll(".breeding-marker")].map(node => clean(node.textContent));
        signatures.forEach((signature, index) => markerLabels.set(signature, labels[index] || signature));
      });
      const selectedMarker = markerFilter.value;
      markerFilter.innerHTML = '<option value="">Alla förädlingsmarkörer</option>';
      [...markerLabels.entries()].sort((a, b) => sortNatural(a[1], b[1])).forEach(([signature, label]) => {
        const option = document.createElement("option");
        option.value = signature;
        option.textContent = label;
        markerFilter.appendChild(option);
      });
      if (markerLabels.has(selectedMarker)) markerFilter.value = selectedMarker;
      render();
    }

    function photoButtons(p, activeFile) {
      if ((p.photos || []).length <= 1) return "";
      const displayLabel = plantDisplayLabel(p);
      return p.photos.map(photo => {
        const label = (photo.label || (photo.date + " · " + photo.type)) + (photo.day ? " · dag " + photo.day : "");
        return `
          <button class="thumb ${photo.file === activeFile ? "active" : ""}" type="button"
            data-plant="${escapeAttr(displayLabel)}" data-file="${photo.file}" data-label="${escapeAttr(label)}" data-photo-type="${escapeAttr(photo.type)}">
            <img src="${photo.file}" alt="${escapeAttr(displayLabel + " " + photo.date)}" loading="lazy">
          </button>`;
      }).join("");
    }

    function preferredCardPhoto(photos) {
      const flowerPhotos = photos.filter(photo => clean(photo.type).toLowerCase() === "blomma");
      return flowerPhotos[flowerPhotos.length - 1] || photos[photos.length - 1] || {};
    }

    function cardTemplate(p) {
      const displayName = plantDisplayName(p);
      const identity = plantIdentityName(p);
      const displayLabel = plantDisplayLabel(p);
      const photos = p.photos || [];
      const active = preferredCardPhoto(photos);
      const activeFile = active.file || "";
      const activeLabel = active.label || (active.date ? `${active.date} · ${active.type}` : "");
      const dayText = active.day ? ` · dag ${active.day}` : "";
      const crossLabel = hibiscusCrossLabel(p);
      const parentReferenceItems = hibiscusParentReferenceItems(p);
      const latestMilestone = latestPlantMilestone(p.logs);
      const isGift = clean(p.arrival_type) === "Gåva";
      const batchInfo = clean(p.batch)
        ? `<dt>Fröbatch</dt><dd>${escapeText(p.batch)}</dd><dt>Korsning</dt><dd>${escapeText(crossLabel || "Ej angiven")}</dd>`
        : `<dt>Ursprung</dt><dd>${escapeText(clean(p.arrival_type) || "Ej ifyllt")}</dd><dt>${isGift ? "Från" : "Källa"}</dt><dd>${escapeText(isGift ? "Privat" : (clean(p.source) || "Ej ifyllt"))}</dd>`;
      const gallery = photos.map(photo => {
        const label = (photo.label || (photo.date + " · " + photo.type)) + (photo.day ? " · dag " + photo.day : "");
        return {file: photo.file, title: displayName, caption: `${displayLabel} · ${label}`, alt: displayLabel};
      });
      const searchable = [
        p.id, p.nickname, p.batch, p.mother, p.father, p.sown, p.status, getPlantCardNote(p.id, p.card_note, p.card_note_updated_at),
        ...photos.map(x => `${x.date} ${x.type} ${x.file}`),
        ...(p.logs || []).map(x => `${x.date} ${x.type} ${x.note}`)
      ].join(" ").toLowerCase();

      return `
        <article class="plant-card" data-search="${escapeAttr(searchable)}" data-batch="${escapeAttr(p.batch)}" data-status="${escapeAttr(p.status)}" data-category="Hibiskus" data-plant-id="${escapeAttr(p.id)}" data-plant-name="${escapeAttr(displayName)}" data-plant-identity="${escapeAttr(identity)}" data-plant-nickname="${escapeAttr(p.nickname)}" data-parent-cross="${escapeAttr(crossLabel)}" data-parent-references="${escapeAttr(JSON.stringify(parentReferenceItems))}" data-card-image="${escapeAttr(p.card_image)}" data-card-crop-x="${escapeAttr(p.card_crop_x)}" data-card-crop-y="${escapeAttr(p.card_crop_y)}" data-card-image-updated-at="${escapeAttr(p.card_image_updated_at)}" data-cuttings-available="${escapeAttr(p.cuttings_available)}" data-cuttings-updated-at="${escapeAttr(p.cuttings_updated_at)}" data-gallery="${escapeAttr(JSON.stringify(gallery))}" data-milestones="${escapeAttr(JSON.stringify(p.logs || []))}">
          <div class="image-wrap">
            ${activeFile ? `<img class="main-photo" src="${activeFile}" alt="${escapeAttr(displayLabel)}" data-caption="${escapeAttr(displayLabel + " · " + activeLabel + dayText)}" data-photo-type="${escapeAttr(active.type)}">` : ""}
            ${activeLabel ? `<div class="date-ribbon">${activeLabel}${dayText}</div>` : ""}
            <div class="plant-card-gallery-slot ${photos.length > 1 ? "has-gallery" : ""}">${photos.length > 1 ? `<div class="thumbs">${photoButtons(p, activeFile)}</div>` : ""}</div>
          </div>
          <div class="card-body">
            <div class="plant-card-head">
              <div class="plant-title-block">${plantHeadingHtml(p)}</div>
              <div class="import-actions">
                <button class="plant-log-btn" type="button" aria-label="Växtpanel" title="Växtpanel">${logBookIcon()}</button>
                <button class="add-photo-btn" type="button" aria-label="Lägg till bild" title="Lägg till bild">${cameraLineIcon()}</button>
                <span class="import-badge" data-import-badge hidden></span>
              </div>
            </div>
            <div class="plant-card-chip-slot"><div class="chips">${collectionChipHtml("Hibiskus", p, escapeText)}${window.hibiscusFlowerMarkerHtml ? window.hibiscusFlowerMarkerHtml(p.id, escapeText) : ""}</div></div>
            <div class="plant-card-info"><dl>${batchInfo}</dl></div>
            <div class="plant-card-milestone-slot">${milestoneSummary(latestMilestone)}</div>
            <div class="plant-card-notes-slot">${plantCardNoteField(p.id, p.card_note, p.card_note_updated_at, "Hibiskus")}</div>
          </div>
        </article>
      `;
    }

    function latestDate(p) {
      return (p.photos || []).map(photo => photo.date).filter(Boolean).sort().at(-1) || "";
    }

    function renderBatchLog() {
      const batches = Object.entries(hibiscusBatches);
      batchLog.hidden = !batchArchiveOpen || !batches.length;
      if (!batchArchiveOpen || !batches.length) return;
      batchLog.innerHTML = `
        <div class="batch-log-head">
          <div>
            <h2>Fröbatcher</h2>
            <div class="batch-log-summary">Kort historik för hibiskussådder innan plantorna fått egna kort.</div>
          </div>
          <button class="batch-log-toggle" type="button" aria-expanded="${batchLogOpen ? "true" : "false"}">${batchLogOpen ? "Dölj historik" : "Visa historik"}</button>
        </div>
        <div class="batch-facts">
          ${batches.map(([id, batch]) => `<div class="batch-fact"><strong>${escapeText(id)}</strong> · ${escapeText(batch.summary.replace(id + " · ", ""))}</div>`).join("")}
        </div>
        <div class="batch-log-detail" ${batchLogOpen ? "" : "hidden"}>
          ${batches.map(([id, batch]) => `
            <section class="batch-log-section">
              <h3>${escapeText(batch.title || id)}</h3>
              <div class="batch-facts">${batch.facts.map(fact => `<div class="batch-fact">${escapeText(fact)}</div>`).join("")}</div>
              <p class="batch-method">${escapeText(batch.method)}</p>
              <div class="batch-log-list">
                ${(batch.events || []).map(row => `
                  <article class="batch-log-item">
                    <div class="batch-log-meta">
                      <span>${escapeText(row.date)}</span>
                      <span>${escapeText(row.type)}</span>
                    </div>
                    ${clean(row.note) ? `<div class="batch-log-note">${escapeText(row.note)}</div>` : ""}
                  </article>
                `).join("")}
              </div>
              ${clean(batch.lesson) ? `<p class="batch-method">${escapeText(batch.lesson)}</p>` : ""}
            </section>
          `).join("")}
        </div>
      `;
    }

    function sortedPlants(list) {
      return [...list].sort((a, b) => {
        if (sortSelect.value === "latest") {
          return sortNatural(latestDate(b), latestDate(a)) || sortNatural(a.id, b.id);
        }
        if (sortSelect.value === "photos") {
          return ((b.photos || []).length - (a.photos || []).length) || sortNatural(a.id, b.id);
        }
        if (sortSelect.value === "status") {
          return sortNatural(clean(a.status) + a.id, clean(b.status) + b.id);
        }
        return sortNatural(a.id, b.id);
      });
    }

    function visiblePlants() {
      const query = search.value.trim().toLowerCase();
      const selectedBatch = batchFilter.value;
      const selectedSubBatch = subBatchFilter.value;
      const selectedStatus = statusFilter.value === "__concluded_only__" ? "" : statusFilter.value;
      const selectedMarker = markerFilter.value;
      return plants.filter(p => {
        const combined = [
          p.id, p.nickname, p.batch, p.mother, p.father, p.sown, p.status,
          ...(p.photos || []).map(x => `${x.date} ${x.type} ${x.file}`),
          ...(p.logs || []).map(x => `${x.date} ${x.type} ${x.note}`)
        ].join(" ").toLowerCase();
        return (!query || combined.includes(query))
          && (!selectedBatch || p.batch === selectedBatch)
          && (!selectedSubBatch || subBatchForPlant(p) === selectedSubBatch)
          && (!selectedStatus || p.status === selectedStatus)
          && (!selectedMarker || (window.hibiscusFlowerMarkerSignatures?.(p.id) || []).includes(selectedMarker));
      });
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const selectedBatch = batchFilter.value;
      const selectedSubBatch = subBatchFilter.value;
      const selectedStatus = statusFilter.value === "__concluded_only__" ? "" : statusFilter.value;
      const selectedMarker = markerFilter.value;
      const filtered = visiblePlants();
      const visible = sortedPlants(filtered);
      grid.innerHTML = visible.length ? visible.map(cardTemplate).join("") : '<div class="empty">Inga hibiskusar matchar sökningen just nu.</div>';
      updatePlantImageImportUI();
      updatePlantFavoriteUI();
      const photoCount = plants.reduce((sum, p) => sum + (p.photos || []).length, 0);
      const activeParts = [
        query ? `Sökning: “${search.value.trim()}”` : "",
        selectedBatch ? `Fröbatch: ${selectedBatch}` : "",
        selectedSubBatch ? `Korsning: ${selectedSubBatch}` : "",
        selectedStatus ? `Status: ${selectedStatus}` : "",
        selectedMarker ? `Förädlingsmarkör: ${markerFilter.options[markerFilter.selectedIndex].textContent}` : "",
        `Sortering: ${sortSelect.options[sortSelect.selectedIndex].textContent}`
      ].filter(Boolean);
      stats.innerHTML = `
        <span class="stat">${plants.length} plantor</span>
        <span class="stat">${photoCount} bilder</span>
        <span class="stat">${visible.length} visas just nu</span>
        <span class="stat">${activeParts.join(" · ")}</span>
      `;
      renderBatchLog();
    }

    function updateBulkCount() {
      const count = bulkMilestoneDialog.querySelectorAll("[data-bulk-plant]:checked").length;
      const target = bulkMilestoneDialog.querySelector("[data-bulk-count]");
      if (target) target.textContent = `${count} valda`;
    }

    function openBulkMilestoneDialog() {
      const defaultBatch = batchFilter.value;
      const defaultSubBatch = subBatchFilter.value;
      const batches = [...new Set(plants.map(p => clean(p.batch)).filter(Boolean))].sort((a, b) => sortNatural(a, b));
      const sourcePlants = sortedPlants(plants);
      const options = plantMilestoneTypes
        .map(type => `<option value="${escapeText(type)}" ${type === "Omplanterad" ? "selected" : ""}>${escapeText(type)}</option>`)
        .join("");
      const batchOptions = [
        `<option value="">Alla fröbatcher</option>`,
        ...batches.map(batch => `<option value="${escapeAttr(batch)}" ${batch === defaultBatch ? "selected" : ""}>${escapeText(batch)}</option>`)
      ].join("");
      const plantItems = (selectedBatch, selectedSubBatch) => {
        const list = sourcePlants.filter(p => (!selectedBatch || clean(p.batch) === selectedBatch) && (!selectedSubBatch || subBatchForPlant(p) === selectedSubBatch));
        return list.map(p => `
          <label class="bulk-item">
            <input type="checkbox" data-bulk-plant value="${escapeAttr(p.id)}" checked>
            ${escapeText(p.id)}
          </label>
        `).join("") || '<div class="empty">Inga plantor i valt urval.</div>';
      };
      const selectedCount = (selectedBatch, selectedSubBatch) => sourcePlants.filter(p => (!selectedBatch || clean(p.batch) === selectedBatch) && (!selectedSubBatch || subBatchForPlant(p) === selectedSubBatch)).length;
      bulkMilestoneDialog.innerHTML = `
        <form class="bulk-panel" method="dialog">
          <header>
            <div>
              <h2>Milstolpar flera</h2>
              <p>Välj fröbatch eller korsning och bocka ur plantor som inte ska få milstolpen.</p>
            </div>
            <button class="bulk-close" type="button" aria-label="Stäng">×</button>
          </header>
          <div class="bulk-fields">
            <input name="date" type="date" value="${escapeAttr(localDateString())}" aria-label="Datum" required>
            <select name="type" aria-label="Typ av milstolpe" required>${options}</select>
          </div>
          <div class="bulk-scope">
            <label for="bulkBatchSelect">Fröbatch</label>
            <select id="bulkBatchSelect" name="batch" aria-label="Välj fröbatch">${batchOptions}</select>
          </div>
          <div class="bulk-scope">
            <label for="bulkSubBatchSelect">Korsning</label>
            <select id="bulkSubBatchSelect" name="subBatch" aria-label="Välj korsning">${subBatchOptionHtml(defaultBatch, defaultSubBatch)}</select>
          </div>
          <textarea name="note" maxlength="160" placeholder="Kort anteckning, frivilligt"></textarea>
          <div class="bulk-actions">
            <button class="secondary" type="button" data-bulk-select-all>Markera alla</button>
            <button class="secondary" type="button" data-bulk-select-none>Avmarkera alla</button>
            <span class="bulk-count" data-bulk-count>${selectedCount(defaultBatch, defaultSubBatch)} valda</span>
          </div>
          <div class="bulk-list">
            ${plantItems(defaultBatch, defaultSubBatch)}
          </div>
          <button class="bulk-submit" type="submit">Spara på valda plantor</button>
        </form>
      `;
      bulkMilestoneDialog.querySelector(".bulk-close").addEventListener("click", () => bulkMilestoneDialog.close(), {once: true});
      const bulkBatchSelect = bulkMilestoneDialog.querySelector("#bulkBatchSelect");
      const bulkSubBatchSelect = bulkMilestoneDialog.querySelector("#bulkSubBatchSelect");
      const refreshBulkList = () => {
        bulkMilestoneDialog.querySelector(".bulk-list").innerHTML = plantItems(bulkBatchSelect.value, bulkSubBatchSelect.value);
        updateBulkCount();
      };
      bulkSubBatchSelect.disabled = !knownSubBatches(defaultBatch).length;
      bulkBatchSelect.addEventListener("change", () => {
        bulkSubBatchSelect.innerHTML = subBatchOptionHtml(bulkBatchSelect.value, "");
        bulkSubBatchSelect.disabled = !knownSubBatches(bulkBatchSelect.value).length;
        refreshBulkList();
      });
      bulkSubBatchSelect.addEventListener("change", refreshBulkList);
      bulkMilestoneDialog.querySelector("[data-bulk-select-all]").addEventListener("click", () => {
        bulkMilestoneDialog.querySelectorAll("[data-bulk-plant]").forEach(input => input.checked = true);
        updateBulkCount();
      });
      bulkMilestoneDialog.querySelector("[data-bulk-select-none]").addEventListener("click", () => {
        bulkMilestoneDialog.querySelectorAll("[data-bulk-plant]").forEach(input => input.checked = false);
        updateBulkCount();
      });
      bulkMilestoneDialog.querySelector(".bulk-list").addEventListener("change", updateBulkCount);
      bulkMilestoneDialog.querySelector("form").addEventListener("submit", event => {
        event.preventDefault();
        const form = event.currentTarget;
        const ids = [...bulkMilestoneDialog.querySelectorAll("[data-bulk-plant]:checked")].map(input => input.value);
        const added = addPlantMilestoneEntries(ids.map(id => ({
          id,
          date: form.elements.date.value,
          type: form.elements.type.value,
          note: form.elements.note.value
        })));
        bulkMilestoneDialog.close();
        if (added.length) {
          window.dispatchEvent(new CustomEvent("plant-milestone-added", {detail: {count: added.length}}));
        }
      });
      bulkMilestoneDialog.showModal();
    }

    grid.addEventListener("click", event => {
      const thumb = event.target.closest(".thumb");
      const main = event.target.closest(".main-photo");
      if (thumb) {
        const card = thumb.closest(".plant-card");
        const img = card.querySelector(".main-photo");
        const ribbon = card.querySelector(".date-ribbon");
        card.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
        thumb.classList.add("active");
        img.src = thumb.dataset.file;
        img.dataset.photoType = thumb.dataset.photoType || "";
        img.dataset.caption = `${thumb.dataset.plant} · ${thumb.dataset.label}`;
        ribbon.textContent = thumb.dataset.label;
      }
      if (main) {
        openPlantPhotoGallery(main);
      }
    });
    batchLog.addEventListener("click", event => {
      if (!event.target.closest(".batch-log-toggle")) return;
      batchLogOpen = !batchLogOpen;
      renderBatchLog();
    });
    ensurePlantPhotoGallery();
    ensurePlantMilestones();
    ensurePlantImageImport();
    ensurePlantFavorites();
    clearBtn.addEventListener("click", () => {
      search.value = "";
      batchFilter.value = "";
      populateSubBatchFilter();
      statusFilter.value = "";
      markerFilter.value = "";
      sortSelect.value = "id";
      render();
    });
    search.addEventListener("input", render);
    batchFilter.addEventListener("change", () => {
      populateSubBatchFilter();
      render();
    });
    subBatchFilter.addEventListener("change", render);
    statusFilter.addEventListener("change", render);
    markerFilter.addEventListener("change", render);
    sortSelect.addEventListener("change", render);
    window.addEventListener("plant-milestone-added", rebuild);
    window.addEventListener("hibiscus-flower-data-changed", rebuild);
    rebuild();
    if (requestedTool === "milstolpar") openBulkMilestoneDialog();
  </script>
</body>
</html>
