<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korsningar · Mina Växter</title>
  <style>
    :root { --bg:#f5f1ea; --paper:#fffdf8; --ink:#2b251f; --muted:#6f655b; --line:#ded2c2; --accent:#7d4f3b; --chip:#efe6da; --shadow:0 14px 40px rgba(62,43,28,.12); --radius:22px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top left,rgba(125,79,59,.10),transparent 35rem),radial-gradient(circle at top right,rgba(96,119,97,.10),transparent 30rem),var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.5; }
    header { padding:46px 22px 26px; text-align:center; }
    nav { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    nav a { color:var(--accent); text-decoration:none; font-weight:750; }
    nav a.current { color:var(--ink); }
    main { max-width:1060px; margin:0 auto; padding:0 18px 72px; }
    .eyebrow { color:var(--accent); letter-spacing:.18em; text-transform:uppercase; font-size:.78rem; font-weight:800; }
    h1 { margin:8px 0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(2.7rem,8vw,5.5rem); line-height:.92; font-weight:500; }
    .subtitle { max-width:650px; margin:0 auto; color:var(--muted); font-size:1.05rem; }
    .new-crossing, .crossing-card { background:rgba(255,253,248,.88); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    .new-crossing { margin-bottom:24px; overflow:hidden; }
    .new-crossing > details { padding:18px; }
    .new-crossing > details > summary { color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:1.55rem; letter-spacing:0; text-transform:none; }
    .crossing-card h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:1.16rem; font-weight:500; line-height:1.24; }
    .new-crossing p, .crossing-card p { color:var(--muted); }
    .crossing-form, .event-form, .offspring-form, .sow-batch-form { display:grid; gap:10px; }
    .crossing-form { grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:14px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:.85rem; font-weight:800; }
    label.full { grid-column:1 / -1; }
    input, select, textarea, button { width:100%; border:1px solid var(--line); border-radius:13px; padding:10px 11px; background:var(--paper); color:var(--ink); font:inherit; }
    .crossing-date-field { display:block; min-width:0; max-width:100%; overflow:hidden; border:1px solid var(--line); border-radius:13px; background:var(--paper); }
    .crossing-date-field input[type="date"] { display:block; width:100%; min-width:0; min-inline-size:0; max-width:100%; max-inline-size:100%; border:0; border-radius:0; background:transparent; }
    textarea { min-height:70px; resize:vertical; }
    button { border-color:var(--accent); background:var(--accent); color:white; cursor:pointer; font-weight:850; }
    button.secondary { background:var(--paper); color:var(--accent); border-color:rgba(125,79,59,.35); }
    .form-actions { display:flex; justify-content:flex-end; grid-column:1 / -1; }
    .form-actions button { width:auto; }
    .notice { min-height:1.3em; margin:10px 0 0; color:var(--muted); font-weight:700; }
    .notice.success { color:#435943; }
    .notice.error { color:#8a4a3c; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); align-items:start; gap:18px; min-width:0; }
    .crossing-card { padding:15px; display:grid; gap:10px; }
    .crossing-card.is-active-sowing { border-color:#6f936f; box-shadow:0 0 0 2px rgba(96,119,97,.16), var(--shadow); }
    .new-crossing, .crossing-card, .crossing-head, .crossing-details, .details-content, .event-form, .offspring-form, .dialog-panel { min-width:0; max-width:100%; }
    .crossing-head h2 { min-width:0; display:grid; gap:2px; overflow-wrap:anywhere; }
    .crossing-parent-pair { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:baseline; gap:7px; }
    .crossing-parent-pair .cross-symbol { font-size:1.05em; }
    .status { display:inline-flex; align-items:center; min-height:22px; padding:3px 7px; border-radius:999px; background:rgba(111,101,91,.09); color:var(--muted); font-size:.7rem; font-weight:700; white-space:nowrap; }
    .status.active { background:rgba(96,119,97,.11); color:#526752; }
    .status.ended { background:rgba(138,74,60,.08); color:#975e52; }
    .parents { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:11px 0; }
    .parent { min-width:0; display:grid; gap:2px; }
    .parent:last-child { text-align:right; }
    .parent small, .card-label { color:var(--muted); font-size:.73rem; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .parent strong { overflow-wrap:anywhere; }
    .parent-references { display:grid; gap:8px; border-top:1px solid var(--line); padding-top:11px; }
    .parent-reference-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .parent-reference-card { min-width:0; display:grid; grid-template-rows:112px auto; gap:8px; padding:8px; border:1px solid var(--line); border-radius:15px; color:inherit; background:rgba(255,255,255,.42); text-decoration:none; }
    .parent-reference-card img, .parent-reference-placeholder { width:100%; height:112px; border-radius:11px; object-fit:cover; background:linear-gradient(135deg,rgba(125,79,59,.14),rgba(96,119,97,.13)); }
    .parent-reference-placeholder { display:grid; place-items:center; color:var(--muted); font-size:.8rem; font-weight:800; }
    .parent-reference-copy { min-width:0; display:grid; gap:1px; }
    .parent-reference-copy small { color:var(--accent); font-size:.7rem; font-weight:900; letter-spacing:.07em; text-transform:uppercase; }
    .parent-reference-copy strong, .parent-reference-copy span { overflow-wrap:anywhere; }
    .parent-reference-copy span { color:var(--muted); font-size:.78rem; font-weight:800; }
    .cross-symbol { color:var(--accent); font-size:1.3rem; font-weight:900; }
    .facts { display:grid; grid-template-columns:auto 1fr; gap:5px 10px; font-size:.91rem; }
    .facts dt { color:var(--muted); font-weight:800; }
    .facts dd { min-width:0; margin:0; overflow-wrap:anywhere; }
    .crossing-card details { padding-top:4px; }
    summary { cursor:pointer; color:var(--accent); font-size:.79rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .crossing-details { position:relative; }
    .crossing-details > summary { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 0; overflow-wrap:anywhere; color:var(--muted); font-size:.82rem; font-weight:600; letter-spacing:0; text-transform:none; }
    .crossing-details > summary .status { flex:0 0 auto; }
    .details-content { display:grid; gap:12px; padding-top:12px; }
    .events, .offspring-list { display:grid; gap:8px; margin-top:10px; }
    .event, .offspring { border:1px solid var(--line); border-radius:13px; padding:9px 10px; background:rgba(255,255,255,.42); }
    .event strong, .offspring strong { font-size:.9rem; }
    .event small, .offspring small { color:var(--muted); }
    .event p { margin:4px 0 0; font-size:.88rem; }
    .sow-batches { display:grid; gap:8px; }
    .sow-batch-list { display:grid; gap:8px; }
    .sow-batch { display:grid; gap:7px; border:1px solid var(--line); border-radius:13px; padding:10px; background:rgba(255,255,255,.42); }
    .sow-batch-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .sow-batch-head strong { color:var(--accent); }
    .sow-batch-meta { color:var(--muted); font-size:.86rem; font-weight:700; }
    .card-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .card-actions button, .card-actions a { width:auto; display:inline-flex; align-items:center; justify-content:center; padding:9px 12px; border:1px solid rgba(125,79,59,.35); border-radius:999px; background:var(--paper); color:var(--accent); text-decoration:none; font-weight:850; }
    .empty { grid-column:1 / -1; padding:24px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:18px; font-weight:750; }
    dialog { width:min(94vw,520px); border:0; border-radius:22px; padding:0; background:var(--paper); color:var(--ink); box-shadow:0 24px 80px rgba(0,0,0,.26); }
    dialog::backdrop { background:rgba(22,18,15,.50); }
    .dialog-panel { padding:18px; display:grid; gap:14px; }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .dialog-head h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:1.55rem; }
    .dialog-head button { width:38px; height:38px; padding:0; background:transparent; color:var(--ink); border-color:var(--line); font-size:1.25rem; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
    .dialog-actions button { width:auto; }
    @media (max-width:650px) { header { padding-top:28px; } .crossing-form { grid-template-columns:1fr; } .form-actions { grid-column:auto; } .parents { gap:5px; } .parent-reference-card { grid-template-rows:96px auto; } .parent-reference-card img, .parent-reference-placeholder { height:96px; } }
    @media (max-width:350px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">← Mina Växter</a>
      <a href="hibiskusar.html">Hibiskus</a>
      <a href="pelargoner.html">Pelargon</a>
      <a href="citrus.html">Citrus</a>
      <a href="udda.html">Udda</a>
      <a href="stapeliader.html">Stapelia</a>
      <a href="favoriter.html">Hundöron</a>
      <a class="current" href="vaxtliv.html">Växtliv</a>
      <a href="galleri.html">Galleri</a>
      <a href="verktyg.html">Verktyg</a>
    </nav>
    <div class="eyebrow">Växtliv</div>
    <h1>Korsningar</h1>
    <p class="subtitle">Pollineringar, frösättning och avkommor med sin historik.</p>
  </header>
  <main>
    <section class="new-crossing" aria-labelledby="newCrossingTitle">
      <details id="newCrossingDetails">
        <summary id="newCrossingTitle">Registrera ny</summary>
        <p>Moderplantan kommer från kortet du öppnade. Välj pollenförälder och registrera första pollineringen.</p>
        <form id="crossingForm" class="crossing-form">
          <label>Kategori
            <select name="category" required><option value="Pelargon">Pelargon</option><option value="Hibiskus">Hibiskus</option></select>
          </label>
          <label>Datum för pollinering
            <span class="crossing-date-field"><input name="date" type="date" required></span>
          </label>
          <label>Moder / fröförälder
            <select name="mother" required></select>
          </label>
          <label>Pollenförälder
            <select name="father" required></select>
          </label>
          <label class="full">Kort anteckning, frivilligt
            <textarea name="note" maxlength="240" placeholder="T.ex. blomma nummer två, kapsel märkt…"></textarea>
          </label>
          <div class="form-actions"><button type="submit">Spara pollinering</button></div>
        </form>
        <p id="notice" class="notice" role="status"></p>
      </details>
    </section>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <dialog id="offspringDialog"></dialog>
  <dialog id="sowBatchDialog"></dialog>
  <script src="common.js?v=crossing-sort-1811"></script>
  <script>
    const PUBLIC_CATALOG_SCHEMA_VERSION = 2;
    const parameters = new URLSearchParams(window.location.search);
    const requestedCategory = parameters.get("category") || "";
    const requestedMother = parameters.get("mother") || "";
    const form = document.querySelector("#crossingForm");
    const newCrossingDetails = document.querySelector("#newCrossingDetails");
    const grid = document.querySelector("#grid");
    const notice = document.querySelector("#notice");
    const offspringDialog = document.querySelector("#offspringDialog");
    const sowBatchDialog = document.querySelector("#sowBatchDialog");
    let snapshot = null;

    if (requestedCategory && requestedMother) newCrossingDetails.open = true;

    function esc(value) {
      return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    function today() { return localDateString(); }

    function displayDate(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return value || "—";
      const months = ["jan", "feb", "mars", "apr", "maj", "juni", "juli", "aug", "sep", "okt", "nov", "dec"];
      return `${Number(match[3])} ${months[Number(match[2]) - 1]} ${match[1]}`;
    }

    function pageFor(category) { return category === "Hibiskus" ? "hibiskusar.html" : "pelargoner.html"; }

    function plants(category) {
      return snapshot?.categories?.[category]?.plants || [];
    }

    function plant(category, id) { return plants(category).find(row => row.id === id) || null; }

    function plantLabel(category, id) {
      const row = plant(category, id);
      if (!row) return id || "Okänd";
      if (category === "Hibiskus") return row.nickname ? `${row.id} · ${row.nickname}` : row.id;
      return row.name || row.id;
    }

    function plantVisibleId(category, id) {
      const row = plant(category, id);
      return category === "Pelargon" ? (row?.label_number || id || "—") : (row?.id || id || "—");
    }

    function plantMainPhoto(category, id) {
      const row = plant(category, id);
      if (!row) return "";
      if (row.card_image) return row.card_image;
      const photos = snapshot?.categories?.[category]?.photos || [];
      return photos.filter(photo => photo.plant_id === id)
        .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.file).localeCompare(String(b.file)))
        .at(-1)?.file || "";
    }

    function parentReferenceHtml(crossing, role, id) {
      const photo = plantMainPhoto(crossing.category, id);
      const visibleId = plantVisibleId(crossing.category, id);
      return `<a class="parent-reference-card" href="${esc(pageFor(crossing.category))}#${esc(id)}">
        ${photo ? `<img src="${esc(photo)}" alt="${esc(`${role} ${plantLabel(crossing.category, id)}`)}" loading="lazy">` : '<div class="parent-reference-placeholder">Ingen bild</div>'}
        <span class="parent-reference-copy"><small>${esc(role)}</small><strong>${esc(plantLabel(crossing.category, id))}</strong><span>${esc(visibleId)}</span></span>
      </a>`;
    }

    function localModel() {
      const source = snapshot?.crossings || {};
      const byId = new Map((source.items || []).map(item => [item.crossing_id, {...item}]));
      const events = (source.events || []).map(item => ({...item}));
      const seedLotById = new Map((source.seedLots || []).map(item => [item.seed_lot_id, {...item}]));
      const sowBatchById = new Map((source.sowBatches || []).map(item => [item.sow_batch_id, {...item}]));
      const eventIds = new Set(events.map(item => item.event_id));
      getPendingCrossingItems().forEach(operation => {
        if (operation.kind === "crossing" && operation.crossing?.crossing_id) {
          const existing = byId.get(operation.crossing.crossing_id) || {};
          byId.set(operation.crossing.crossing_id, {...existing, ...operation.crossing});
        }
        if (operation.kind === "event" && operation.event?.event_id && !eventIds.has(operation.event.event_id)) {
          events.push({...operation.event});
          eventIds.add(operation.event.event_id);
        }
        if (operation.kind === "seed_lot" && operation.seed_lot?.seed_lot_id) {
          const existing = seedLotById.get(operation.seed_lot.seed_lot_id) || {};
          seedLotById.set(operation.seed_lot.seed_lot_id, {...existing, ...operation.seed_lot});
        }
        if (operation.kind === "sow_batch" && operation.sow_batch?.sow_batch_id) {
          const existing = sowBatchById.get(operation.sow_batch.sow_batch_id) || {};
          sowBatchById.set(operation.sow_batch.sow_batch_id, {...existing, ...operation.sow_batch});
        }
      });
      return {crossings:[...byId.values()], events, seedLots:[...seedLotById.values()], sowBatches:[...sowBatchById.values()]};
    }

    function eventsFor(crossingId) {
      return localModel().events.filter(event => event.crossing_id === crossingId)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.created_at).localeCompare(String(a.created_at)));
    }

    function childrenFor(crossing) {
      const category = crossing.category;
      const batchIds = new Set(batchesForCrossing(crossing.crossing_id).map(batch => batch.sow_batch_id));
      return (snapshot?.categories?.[category]?.plants || []).filter(row => row.crossing_id === crossing.crossing_id || batchIds.has(row.sow_batch_id));
    }

    function batchesForCrossing(crossingId) {
      const model = localModel();
      const seedLotIds = new Set(model.seedLots.filter(lot => lot.crossing_id === crossingId).map(lot => lot.seed_lot_id));
      return model.sowBatches.filter(batch => seedLotIds.has(batch.seed_lot_id))
        .sort((a, b) => sowBatchCode(a, model).localeCompare(sowBatchCode(b, model)));
    }

    function seedLotsForCrossing(crossingId) {
      return localModel().seedLots.filter(lot => lot.crossing_id === crossingId)
        .sort((a, b) => String(a.seed_lot_code).localeCompare(String(b.seed_lot_code)));
    }

    function eventsForSeedLot(seedLot, seedLots, events) {
      const index = seedLots.findIndex(lot => lot.seed_lot_id === seedLot.seed_lot_id);
      const nextLot = seedLots[index + 1];
      return events.filter(event => {
        if (seedLot.pollinated_date && String(event.date) < String(seedLot.pollinated_date)) return false;
        if (nextLot?.pollinated_date && String(event.date) >= String(nextLot.pollinated_date)) return false;
        return true;
      });
    }

    function childrenForBatch(batchId) {
      return (snapshot?.categories?.Pelargon?.plants || []).filter(row => row.sow_batch_id === batchId);
    }

    function sowBatchCode(batch, model = localModel()) {
      const seedLot = model.seedLots.find(lot => lot.seed_lot_id === batch.seed_lot_id);
      return `${seedLot?.seed_lot_code || ""}-${batch.sow_code}`.replace(/^-/, "");
    }

    function crossingPrefix(motherId, fatherId) {
      const initial = (value, category) => {
        const label = plantLabel(category, value);
        const quoted = label.match(/[‘']([^’']+)/);
        if (quoted) return quoted[1].charAt(0).toLocaleUpperCase("sv");
        const cleaned = label.replace(/^P\.\s*/i, "").trim();
        const match = cleaned.match(/[A-Za-zÅÄÖåäö]/);
        return match ? match[0].toLocaleUpperCase("sv") : "P";
      };
      const year = String(new Date().getFullYear()).slice(-2);
      const base = `${initial(motherId, "Pelargon")}×${initial(fatherId, "Pelargon")} ${year}`;
      const used = new Set(localModel().crossings.filter(item => item.category === "Pelargon").map(item => clean(item.seedling_prefix).toLocaleLowerCase("sv")));
      let candidate = base;
      let suffix = 2;
      while (used.has(candidate.toLocaleLowerCase("sv"))) candidate = `${base}-${suffix++}`;
      return candidate;
    }

    function nextHibiscusCode() {
      const numbers = [
        ...(snapshot?.categories?.Hibiskus?.plants || []).map(row => (row.id || "").match(/^PL-H(\d{2})(?:-|$)/)).filter(Boolean).map(match => Number(match[1])),
        ...localModel().crossings.filter(item => item.category === "Hibiskus").map(item => (item.hibiscus_batch || "").match(/^PL-H(\d{2})$/)).filter(Boolean).map(match => Number(match[1]))
      ];
      return {batch:`PL-H${String(Math.max(0, ...numbers) + 1).padStart(2, "0")}`, code:"A"};
    }

    function crossingId(category) {
      return `KRS-${category === "Hibiskus" ? "H" : "P"}-${localQueueId("id").replace(/[^A-Za-z0-9]/g, "").slice(-12).toUpperCase()}`;
    }

    function fillParentChoices() {
      const category = form.elements.category.value;
      const rows = plants(category);
      const optionHtml = rows.map(row => `<option value="${esc(row.id)}">${esc(plantLabel(category, row.id))}</option>`).join("");
      const mother = form.elements.mother;
      const father = form.elements.father;
      const previousMother = mother.value;
      const previousFather = father.value;
      mother.innerHTML = optionHtml;
      father.innerHTML = optionHtml;
      const preferredMother = category === requestedCategory && requestedMother && rows.some(row => row.id === requestedMother) ? requestedMother : previousMother;
      if (rows.some(row => row.id === preferredMother)) mother.value = preferredMother;
      if (rows.some(row => row.id === previousFather)) father.value = previousFather;
      if (!father.value && rows.length > 1) father.value = rows.find(row => row.id !== mother.value)?.id || rows[0]?.id || "";
    }

    function showNotice(message, kind = "") {
      notice.textContent = message;
      notice.className = `notice ${kind}`;
    }

    function statusClass(status) { return status === "Avslutad" ? "ended" : "active"; }

    function displayCrossingStatus(crossing, batches) {
      return batches.length ? "Sådd" : crossing.status;
    }

    function render() {
      const model = localModel();
      const cards = sortCrossingOverviewRows(model.crossings.map(crossing => ({...crossing, displayStatus: displayCrossingStatus(crossing, batchesForCrossing(crossing.crossing_id)), latestDate: eventsFor(crossing.crossing_id)[0]?.date})))
        .map(crossing => {
          const events = eventsFor(crossing.crossing_id);
          const batches = batchesForCrossing(crossing.crossing_id);
          const displayStatus = displayCrossingStatus(crossing, batches);
          const children = childrenFor(crossing);
          const suffix = `${crossing.hibiscus_batch || "—"}-${crossing.hibiscus_cross_code || "—"}`;
          const eventsHtml = events.length ? events.map(event => `<article class="event"><strong>${esc(displayDate(event.date))} · ${esc(event.type)}</strong>${event.note ? `<p>${esc(event.note)}</p>` : ""}</article>`).join("") : '<div class="event"><small>Ingen händelse ännu.</small></div>';
          const parentReferences = `<section class="parent-references" aria-label="Föräldrareferenser"><div class="card-label">Föräldrareferenser</div><div class="parent-reference-grid">${parentReferenceHtml(crossing, "♀ Moder", crossing.mother_id)}${parentReferenceHtml(crossing, "♂ Pollen", crossing.father_id)}</div></section>`;
          const batchHtml = batch => {
            const batchChildren = childrenForBatch(batch.sow_batch_id);
            const germinated = batch.germinated_count == null ? 0 : Number(batch.germinated_count);
            return `<article class="sow-batch"><div class="sow-batch-head"><strong>${esc(batch.sow_code)}</strong><small>${esc(sowBatchCode(batch))}</small></div><div class="sow-batch-meta">Sådd: ${esc(displayDate(batch.sown_date))} · ${esc(batch.seeds_sown)} sådda · ${esc(batch.pot_count)} ${Number(batch.pot_count) === 1 ? "kruka" : "krukor"} · ${esc(germinated)} grodda · ${esc(batchChildren.length)} avkommor</div><div class="card-actions"><button type="button" class="secondary" data-create-offspring="${esc(batch.sow_batch_id)}">Skapa avkomma</button><button type="button" class="secondary" data-edit-sow-batch="${esc(batch.sow_batch_id)}">Uppdatera</button></div></article>`;
          };
          const seedLots = seedLotsForCrossing(crossing.crossing_id);
          const sowBatchSection = crossing.category === "Pelargon" ? `<details class="sow-batches"><summary><span>Fröomgångar / Såbatcher</span><span>· ${seedLots.length}</span></summary><div class="sow-batches-content"><div class="sow-batch-head"><div class="card-label">Fröomgångar</div><button type="button" class="secondary" data-create-sow-batch="${esc(crossing.crossing_id)}">Registrera såbatch</button></div>${seedLots.length ? seedLots.map(seedLot => { const lotEvents = eventsForSeedLot(seedLot, seedLots, events); const lotBatches = batches.filter(batch => batch.seed_lot_id === seedLot.seed_lot_id); const harvested = lotEvents.find(event => event.type === "Frö skördat"); const harvestedCount = harvested?.note?.match(/\d+/)?.[0]; const eventRows = lotEvents.filter(event => event.type !== "Sådd").map(event => `<li>${esc(event.type)}: ${esc(displayDate(event.date))}</li>`).join(""); return `<section class="seed-lot"><h3>Fröomgång ${esc(seedLot.seed_lot_code)}</h3><ul class="seed-lot-events">${eventRows || "<li>Inga händelser ännu.</li>"}</ul>${harvestedCount ? `<div class="sow-batch-meta">${esc(harvestedCount)} frön skördade</div>` : ""}<div class="sow-batch-list">${lotBatches.map(batchHtml).join("") || '<div class="event"><small>Inga såbatcher ännu.</small></div>'}</div></section>`; }).join("") : '<div class="event"><small>Ingen fröomgång ännu.</small></div>'}</div></details>` : "";
          const offspringHtml = children.length ? children.map(child => {
            const label = crossing.category === "Pelargon" ? (child.seedling_label || child.name || child.id) : child.id;
            const labelUrl = `verktyg.html?label=${encodeURIComponent(`${crossing.category}|${child.id}`)}#etiketter`;
            const plantUrl = `${pageFor(crossing.category)}#${encodeURIComponent(child.id)}`;
            return `<article class="offspring"><strong><a href="${esc(plantUrl)}">${esc(label)}</a></strong><br><small>${esc([child.label_number, child.status || "Avkomma"].filter(Boolean).join(" · "))}</small><div class="card-actions"><a href="${esc(labelUrl)}">Etikett</a></div></article>`;
          }).join("") : '<div class="offspring"><small>Inga avkommor ännu.</small></div>';
          return `
            <article class="crossing-card ${displayStatus === "Sådd" ? "is-active-sowing" : ""}" id="${esc(crossing.crossing_id)}" data-crossing-id="${esc(crossing.crossing_id)}">
              <div class="crossing-head"><h2><span>${esc(plantLabel(crossing.category, crossing.mother_id))}</span><span class="crossing-parent-pair"><span class="cross-symbol">×</span><span>${esc(plantLabel(crossing.category, crossing.father_id))}</span></span></h2></div>
              <details class="crossing-details"><summary><span>Detaljer ›</span><span class="status ${statusClass(displayStatus)}">${esc(displayStatus)}</span></summary><div class="details-content">
                ${parentReferences}
                <dl class="facts">${crossing.category === "Hibiskus" ? `<dt>Första pollinering</dt><dd>${esc(displayDate(events.filter(event => event.type === "Pollinerad").map(event => event.date).sort()[0] || "—"))}</dd><dt>Hibiskuskod</dt><dd>${esc(suffix)}</dd>` : ""}${crossing.note ? `<dt>Anteckning</dt><dd>${esc(crossing.note)}</dd>` : ""}${crossing.closed_note ? `<dt>Avslutning</dt><dd>${esc(crossing.closed_note)}</dd>` : ""}</dl>
                <details class="event-form-details"><summary>Ny händelse</summary><form class="event-form" data-event-form="${esc(crossing.crossing_id)}"><select name="type"><option>Pollinerad</option><option>Frö utvecklas</option><option>Frö skördat</option><option>Sådd</option><option>Avslutad</option></select><div class="crossing-date-field"><input name="date" type="date" value="${esc(today())}" required></div><textarea name="note" maxlength="240" placeholder="Kort anteckning, frivilligt"></textarea><button type="submit">Spara händelse</button></form></details>
                ${sowBatchSection}
                ${crossing.category === "Hibiskus" ? `<div class="card-actions"><button type="button" class="secondary" data-create-hibiscus-offspring="${esc(crossing.crossing_id)}">Skapa avkomma</button></div>` : ""}
                <details><summary>Historik · ${events.length}</summary><div class="events">${eventsHtml}</div></details>
                <details><summary>Avkommor · ${children.length}</summary><div class="offspring-list">${offspringHtml}</div></details>
              </div></details>
            </article>`;
        }).join("");
      grid.innerHTML = cards || '<div class="empty">Inga korsningar registrerade ännu.</div>';
    }

    function queuePollination(crossing, date, note) {
      queueCrossingChange("crossing", crossing);
      queueCrossingChange("event", {
        event_id: localQueueId("cross-event"), crossing_id: crossing.crossing_id,
        date, type:"Pollinerad", note, created_at:new Date().toISOString()
      });
    }

    function queueOffspringDialog({crossing, sowBatch = null}) {
      const subtitle = sowBatch ? `${sowBatchCode(sowBatch)} · sådd ${displayDate(sowBatch.sown_date)}` : `${plantLabel(crossing.category, crossing.mother_id)} × ${plantLabel(crossing.category, crossing.father_id)}`;
      const dateLabel = sowBatch ? "Datum då plantan fick egen kruka" : "Datum för grodd";
      offspringDialog.innerHTML = `<form method="dialog" class="dialog-panel offspring-form"><div class="dialog-head"><div><h2>Skapa avkomma</h2><p>${esc(subtitle)}</p></div><button value="cancel" type="submit" formnovalidate aria-label="Stäng">×</button></div><label>${esc(dateLabel)}<span class="crossing-date-field"><input name="date" type="date" value="${esc(today())}" required></span></label><label>Kort anteckning, frivilligt<textarea name="note" maxlength="240" placeholder="${sowBatch ? "T.ex. stark planta i egen kruka" : "T.ex. första grodden"}"></textarea></label><div class="dialog-actions"><button class="secondary" value="cancel" type="submit" formnovalidate>Avbryt</button><button value="save" type="submit">Skapa avkomma</button></div></form>`;
      offspringDialog.querySelector("form").addEventListener("submit", event => {
        if (event.submitter?.value !== "save") return;
        event.preventDefault();
        const values = new FormData(event.currentTarget);
        const relation = sowBatch ? {sow_batch_id:sowBatch.sow_batch_id} : {crossing_id:crossing.crossing_id};
        queueCrossingChange("offspring", {...relation, date:values.get("date"), note:String(values.get("note") || "").trim()});
        offspringDialog.close();
        showNotice("Avkomman ligger i synkkön och skapas vid nästa Mac-synk.", "success");
        render();
      }, {once:true});
      offspringDialog.showModal();
    }

    function openOffspringDialog(batchId) {
      const model = localModel();
      const sowBatch = model.sowBatches.find(item => item.sow_batch_id === batchId);
      const seedLot = sowBatch && model.seedLots.find(item => item.seed_lot_id === sowBatch.seed_lot_id);
      const crossing = seedLot && model.crossings.find(item => item.crossing_id === seedLot.crossing_id);
      if (crossing && sowBatch) queueOffspringDialog({crossing, sowBatch});
    }

    function openHibiscusOffspringDialog(crossingId) {
      const crossing = localModel().crossings.find(item => item.crossing_id === crossingId);
      if (crossing) queueOffspringDialog({crossing});
    }

    function nextSeedLotCode(crossingId) {
      const year = String(new Date().getFullYear()).slice(-2);
      const letters = seedLotsForCrossing(crossingId)
        .map(lot => lot.seed_lot_code.match(new RegExp(`^${year}([A-Z])$`)))
        .filter(Boolean).map(match => match[1].charCodeAt(0));
      return `${year}${String.fromCharCode(Math.max(64, ...letters) + 1)}`;
    }

    function nextSowCode(seedLotId) {
      const numbers = localModel().sowBatches
        .filter(batch => batch.seed_lot_id === seedLotId)
        .map(batch => Number((batch.sow_code.match(/^B(\d{2})$/) || [])[1] || 0));
      return `B${String(Math.max(0, ...numbers) + 1).padStart(2, "0")}`;
    }

    function openSowBatchDialog(crossingId, batchId = "") {
      const crossing = localModel().crossings.find(item => item.crossing_id === crossingId);
      if (!crossing || crossing.category !== "Pelargon") return;
      const existingBatch = batchId ? localModel().sowBatches.find(item => item.sow_batch_id === batchId) : null;
      const seedLots = seedLotsForCrossing(crossingId);
      const newSeedLotCode = nextSeedLotCode(crossingId);
      const newSeedLotValue = `new:${newSeedLotCode}`;
      const defaultSeedLotId = existingBatch?.seed_lot_id || seedLots.at(-1)?.seed_lot_id || newSeedLotValue;
      const defaultSeedLotCode = existingBatch ? (seedLots.find(lot => lot.seed_lot_id === existingBatch.seed_lot_id)?.seed_lot_code || "") : (seedLots.at(-1)?.seed_lot_code || newSeedLotCode);
      const defaultSowCode = existingBatch?.sow_code || nextSowCode(defaultSeedLotId);
      const seedLotField = existingBatch
        ? `<input value="${esc(defaultSeedLotCode)}" readonly><input name="seed_lot" type="hidden" value="${esc(defaultSeedLotId)}">`
        : `<select name="seed_lot">${seedLots.map(lot => `<option value="${esc(lot.seed_lot_id)}"${lot.seed_lot_id === defaultSeedLotId ? " selected" : ""}>${esc(lot.seed_lot_code)} · befintlig omgång</option>`).join("")}<option value="${esc(newSeedLotValue)}"${seedLots.length ? "" : " selected"}>${esc(newSeedLotCode)} · ny omgång</option></select>`;
      sowBatchDialog.innerHTML = `<form method="dialog" class="dialog-panel sow-batch-form"><div class="dialog-head"><div><h2>${existingBatch ? "Uppdatera såbatch" : "Registrera såbatch"}</h2><p>${esc(plantLabel("Pelargon", crossing.mother_id))} × ${esc(plantLabel("Pelargon", crossing.father_id))}</p></div><button value="cancel" type="submit" formnovalidate aria-label="Stäng">×</button></div><label>Fröomgång${seedLotField}</label><label>Såbatch<input name="sow_code" value="${esc(defaultSowCode)}" readonly></label><label>Sådatum<span class="crossing-date-field"><input name="date" type="date" value="${esc(existingBatch?.sown_date || today())}" ${existingBatch ? "readonly" : "required"}></span></label><label>Antal sådda<input name="seeds" type="number" min="1" inputmode="numeric" value="${esc(existingBatch?.seeds_sown || "")}" required></label><label>Antal krukor<input name="pots" type="number" min="1" inputmode="numeric" value="${esc(existingBatch?.pot_count || "")}" required></label><label>Antal grodda<input name="germinated" type="number" min="0" inputmode="numeric" value="${esc(existingBatch?.germinated_count || "0")}" required></label><div class="dialog-actions"><button class="secondary" value="cancel" type="submit" formnovalidate>Avbryt</button><button value="save" type="submit">Spara såbatch</button></div></form>`;
      const batchForm = sowBatchDialog.querySelector("form");
      if (!existingBatch) batchForm.elements.seed_lot.addEventListener("change", () => {
        batchForm.elements.sow_code.value = String(batchForm.elements.seed_lot.value).startsWith("new:") ? "B01" : nextSowCode(batchForm.elements.seed_lot.value);
      });
      batchForm.addEventListener("submit", event => {
        if (event.submitter?.value !== "save") return;
        event.preventDefault();
        const values = new FormData(batchForm);
        const selectedSeedLot = String(values.get("seed_lot") || "");
        let seedLotId = selectedSeedLot;
        if (!existingBatch && selectedSeedLot.startsWith("new:")) {
          const seedLotCode = selectedSeedLot.slice(4);
          seedLotId = `SL-P-${localQueueId("id").replace(/[^A-Za-z0-9]/g, "").slice(-12).toUpperCase()}`;
          queueCrossingChange("seed_lot", {
            seed_lot_id:seedLotId, crossing_id:crossingId, seed_lot_code:seedLotCode,
            pollinated_date:"", harvested_date:"", created_at:new Date().toISOString()
          });
        }
        queueCrossingChange("sow_batch", {
          sow_batch_id:existingBatch?.sow_batch_id || `SB-P-${localQueueId("id").replace(/[^A-Za-z0-9]/g, "").slice(-12).toUpperCase()}`,
          seed_lot_id:seedLotId, sow_code:String(values.get("sow_code") || ""),
          sown_date:String(values.get("date") || ""), seeds_sown:String(values.get("seeds") || ""), pot_count:String(values.get("pots") || ""),
          germinated_count:String(values.get("germinated") || "0"), last_individual_number:String(existingBatch?.last_individual_number || "0"), created_at:existingBatch?.created_at || new Date().toISOString()
        });
        sowBatchDialog.close();
        showNotice(existingBatch ? "Batchuppdateringen ligger i synkkön." : "Såbatchen ligger i synkkön.", "success");
        render();
      }, {once:true});
      sowBatchDialog.showModal();
    }

    grid.addEventListener("submit", event => {
      const eventForm = event.target.closest("[data-event-form]");
      if (!eventForm) return;
      event.preventDefault();
      const crossing = localModel().crossings.find(item => item.crossing_id === eventForm.dataset.eventForm);
      if (!crossing) return;
      const values = new FormData(eventForm);
      const type = String(values.get("type") || "");
      const date = String(values.get("date") || "");
      const note = String(values.get("note") || "").trim();
      const updatedCrossing = {...crossing, status:type, closed_at:type === "Avslutad" ? date : (type === "Pollinerad" ? "" : crossing.closed_at || ""), closed_note:type === "Avslutad" ? note : (type === "Pollinerad" ? "" : crossing.closed_note || "")};
      queueCrossingChange("crossing", updatedCrossing);
      queueCrossingChange("event", {event_id:localQueueId("cross-event"), crossing_id:crossing.crossing_id, date, type, note, created_at:new Date().toISOString()});
      showNotice(type === "Pollinerad" && crossing.status === "Avslutad" ? "Korsningen är återaktiverad och nytt pollineringstillfälle sparat i kön." : "Korsningshändelsen ligger i synkkön.", "success");
      render();
    });

    grid.addEventListener("click", event => {
      const offspringButton = event.target.closest("[data-create-offspring]");
      const hibiscusButton = event.target.closest("[data-create-hibiscus-offspring]");
      const batchButton = event.target.closest("[data-create-sow-batch]");
      const editBatchButton = event.target.closest("[data-edit-sow-batch]");
      if (offspringButton) openOffspringDialog(offspringButton.dataset.createOffspring);
      if (hibiscusButton) openHibiscusOffspringDialog(hibiscusButton.dataset.createHibiscusOffspring);
      if (batchButton) openSowBatchDialog(batchButton.dataset.createSowBatch);
      if (editBatchButton) {
        const model = localModel();
        const batch = model.sowBatches.find(item => item.sow_batch_id === editBatchButton.dataset.editSowBatch);
        const seedLot = batch && model.seedLots.find(item => item.seed_lot_id === batch.seed_lot_id);
        if (batch && seedLot) openSowBatchDialog(seedLot.crossing_id, batch.sow_batch_id);
      }
    });

    form.elements.category.addEventListener("change", fillParentChoices);
    form.addEventListener("submit", event => {
      event.preventDefault();
      const values = new FormData(form);
      const category = String(values.get("category") || "");
      const mother = String(values.get("mother") || "");
      const father = String(values.get("father") || "");
      const date = String(values.get("date") || "");
      const note = String(values.get("note") || "").trim();
      if (!mother || !father || !date) return;
      if (mother === father) { showNotice("Välj två olika föräldrar.", "error"); return; }
      const existing = localModel().crossings.find(item => item.category === category && item.mother_id === mother && item.father_id === father);
      if (existing) {
        const reactivated = {...existing, status:"Pollinerad", closed_at:"", closed_note:""};
        queuePollination(reactivated, date, note);
        showNotice(existing.status === "Avslutad" ? "Korsningen är återaktiverad. Pollineringstillfället ligger i synkkön." : "Pollineringstillfället är tillagt på den befintliga korsningen.", "success");
      } else {
        const hibiscus = category === "Hibiskus" ? nextHibiscusCode() : {batch:"", code:""};
        const crossing = {
          crossing_id:crossingId(category), category, mother_id:mother, father_id:father, status:"Pollinerad", note,
          seedling_prefix:category === "Pelargon" ? crossingPrefix(mother, father) : "",
          hibiscus_batch:hibiscus.batch, hibiscus_cross_code:hibiscus.code,
          created_at:new Date().toISOString(), closed_at:"", closed_note:""
        };
        queuePollination(crossing, date, note);
        showNotice("Korsningen och första pollineringen ligger i synkkön.", "success");
      }
      form.elements.note.value = "";
      render();
    });

    function validateSnapshot(value, version) {
      const crossings = value?.crossings;
      if (!value || value.schemaVersion !== PUBLIC_CATALOG_SCHEMA_VERSION || value.catalogVersion !== version || !value.categories || !crossings || !Array.isArray(crossings.items) || !Array.isArray(crossings.events) || !Array.isArray(crossings.seedLots) || !Array.isArray(crossings.sowBatches)) throw new Error("Ogiltig offentlig katalogsnapshot.");
      return value;
    }

    async function loadSnapshot() {
      const versionResponse = await fetch("version.json", {cache:"no-store"});
      if (!versionResponse.ok) throw new Error("Kunde inte läsa katalogversionen.");
      const version = String((await versionResponse.json()).version || "").trim();
      const response = await fetch(`public-data/catalog.json?v=${encodeURIComponent(version)}`);
      if (!response.ok) throw new Error("Kunde inte läsa katalogdata.");
      return validateSnapshot(await response.json(), version);
    }

    (async function initialise() {
      form.elements.date.value = today();
      try {
        snapshot = await loadSnapshot();
        window.publicCatalogSnapshot = snapshot;
        if (["Pelargon", "Hibiskus"].includes(requestedCategory)) form.elements.category.value = requestedCategory;
        fillParentChoices();
        render();
        ensurePlantImageImport();
      } catch (error) {
        console.error("Kunde inte starta Korsningar.", error);
        grid.innerHTML = '<div class="empty">Korsningar kunde inte läsas. Uppdatera sidan och kontrollera anslutningen.</div>';
        form.querySelectorAll("input, select, textarea, button").forEach(control => control.disabled = true);
      }
    })();
  </script>
</body>
</html>
