<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mina Växter iPhone</title>
  <style>
    :root {
      --bg: #f5f1ea; --paper: #fffdf8; --ink: #2b251f; --muted: #6f655b;
      --line: #ded2c2; --accent: #7d4f3b; --chip: #efe6da;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pull-refresh-status {
      position: fixed; z-index: 0; inset: 0 0 auto; height: 72px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: .88rem; font-weight: 800; letter-spacing: .01em; opacity: 0; transition: opacity .12s ease-out;
    }
    body.pull-revealed .pull-refresh-status { opacity: 1; }
    .page-shell { position: relative; z-index: 1; transform: translateY(var(--pull-offset, 0px)); transition: transform .22s ease-out; }
    body.pull-active .page-shell { transition: none; }
    body.pull-refreshing .page-shell { transition: transform .16s ease-out; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(245,241,234,.98); backdrop-filter: blur(14px); border-bottom: 1px solid #d2c1ae; box-shadow: 0 4px 14px rgba(43,37,31,.08); padding: 12px 10px 10px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 11vw, 2.45rem); line-height: .95; margin: 0 0 10px; padding: 0 44px; font-weight: 500; text-align: center; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 1px 0 3px; scrollbar-width: none; scroll-snap-type: x proximity; }
    .tabs::-webkit-scrollbar { display: none; }
    .legacy-migration { margin: 0 0 8px; padding: 9px 11px; border: 1px solid #d8b782; border-radius: 12px; background: #fff4df; color: #745127; font-size: .82rem; line-height: 1.35; font-weight: 700; }
    .legacy-migration a { color: inherit; text-decoration-thickness: 1px; }
    .tab { flex: 0 0 auto; scroll-snap-align: start; border: 1px solid var(--line); background: var(--paper); color: var(--accent); border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: .84rem; }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    main { padding: 12px 10px 72px; }
    .search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 11px 14px; font: inherit; margin-bottom: 10px; }
    .cuttings-manager { margin-bottom: 10px; }
    .cuttings-manager[hidden] { display: none; }
    .cuttings-manager details { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; }
    .cuttings-manager summary { list-style: none; padding: 11px 13px; color: var(--accent); font-weight: 850; cursor: pointer; }
    .cuttings-manager summary::-webkit-details-marker { display: none; }
    .cuttings-manager summary::before { content: "＋"; margin-right: 5px; }
    .cuttings-manager details[open] summary::before { content: "−"; }
    .cuttings-manager-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    .cuttings-manage-btn { border: 1px solid var(--line); border-radius: 14px; padding: 0 13px; background: var(--paper); color: var(--accent); font: inherit; font-weight: 800; }
    .mobile-chooser { padding: 14px 16px 16px; overflow: auto; }
    .mobile-add-parent-btn { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: var(--paper); color: var(--accent); font: inherit; font-weight: 800; cursor: pointer; }
    .mobile-add-parent-dialog { width: min(620px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: 0 24px 80px rgba(43,37,31,.3); }
    .mobile-add-parent-dialog::backdrop { background: rgba(43,37,31,.4); backdrop-filter: blur(2px); }
    .mobile-chooser-dialog-content { display: flex; max-height: calc(100vh - 24px); flex-direction: column; }
    .mobile-chooser-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
    .mobile-chooser-dialog-header h2 { margin: 0; color: var(--accent); font-size: 1.1rem; }
    .mobile-chooser-close { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--accent); font: 700 1.2rem/1 sans-serif; }
    .mobile-chooser-categories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
    .mobile-chooser-category { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; background: var(--paper); color: var(--accent); font: inherit; font-size: .82rem; font-weight: 800; cursor: pointer; }
    .mobile-chooser-category.active { background: var(--accent); border-color: var(--accent); color: white; }
    .mobile-chooser input { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 12px; font: inherit; }
    .mobile-chooser-list { display: grid; gap: 7px; max-height: min(58vh, 520px); margin-top: 9px; overflow: auto; }
    .mobile-chooser-item { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 9px; align-items: center; border: 1px solid var(--line); border-radius: 11px; padding: 6px; background: var(--paper); color: var(--ink); text-align: left; font: inherit; }
    .mobile-chooser-item img, .mobile-chooser-empty-image { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--chip); }
    .mobile-chooser-item strong, .mobile-chooser-item small { display: block; overflow-wrap: anywhere; }
    .mobile-chooser-item small { color: var(--muted); font-size: .76rem; }
    .mobile-chooser-empty { color: var(--muted); padding-top: 9px; font-size: .86rem; }
    .cuttings-remove { margin-top: 10px; border: 1px solid rgba(125,79,59,.32); border-radius: 999px; padding: 7px 10px; background: transparent; color: var(--accent); font: inherit; font-size: .78rem; font-weight: 800; }
    .cuttings-remove { display: none; }
    .cuttings-card { position: relative; height: auto !important; min-height: 0 !important; }
    .cuttings-card { align-self: start; flex: 0 0 auto; }
    .cuttings-card.plant-card .image { height: auto !important; min-height: 0 !important; flex: 0 0 auto !important; aspect-ratio: 4 / 3 !important; }
    .cuttings-card.plant-card .body { height: auto !important; min-height: 0 !important; display: block !important; flex: 0 0 auto !important; grid-template-rows: none !important; align-content: initial !important; gap: 0 !important; padding: 10px 12px 12px; }
    .cuttings-card .cuttings-remove { position: absolute; top: 10px; right: 10px; margin: 0; width: 30px; height: 30px; padding: 0; border-color: rgba(255,255,255,.8); background: rgba(43,37,31,.78); color: white; font-size: 0; }
    .cuttings-card .cuttings-remove::before { content: "−"; font-size: 1.15rem; line-height: 1; }
    body.manage-mode .cuttings-card .cuttings-remove { display: grid; place-items: center; }
    .cuttings-card .favorite-corner { display: none !important; }
    .catalog-status-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; min-width: 0; }
    .catalog-status-row .stats { flex: 1 1 auto; min-width: 0; margin: 0; }
    #mobileWishlistAnchor { position: relative; flex: 0 0 auto; }
    #mobileWishlistAnchor .wishlist-slot { display: block; margin: 0; max-width: none; }
    #mobileWishlistAnchor .wishlist-toggle { padding: 4px 0 4px 7px; white-space: nowrap; }
    #mobileWishlistAnchor .wishlist-panel { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: min(320px, calc(100vw - 20px)); }
    .grid { display: grid; gap: 16px; }
    .card { background: var(--paper); border: 1px solid #d5c6b4; border-radius: 18px; overflow: hidden; box-shadow: 0 5px 16px rgba(43,37,31,.08); }
    .image { position: relative; height: min(218px, 54vw); background: linear-gradient(135deg, rgba(125,79,59,.15), rgba(96,119,97,.15)); overflow: hidden; }
    .image img { width: 100%; height: 100%; object-fit: cover; object-position: center 42%; display: block; cursor: zoom-in; }
    .image img.main-photo[data-photo-type="blomma"] { object-position: center center; }
    .photo-strip { display: flex; gap: 7px; overflow-x: auto; padding: 8px 10px 0; scrollbar-width: none; }
    .plant-card-gallery-slot .photo-strip { width: 100%; height: 54px; padding: 0; }
    .photo-strip::-webkit-scrollbar { display: none; }
    .photo-button { flex: 0 0 auto; width: 50px; height: 50px; border: 2px solid transparent; border-radius: 11px; overflow: hidden; padding: 0; background: var(--chip); }
    .photo-button.active { border-color: var(--accent); }
    .photo-button img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .body { padding: 12px; }
    h2 { font-family: Georgia, "Times New Roman", serif; font-size: 1.42rem; line-height: 1.05; margin: 0; padding-right: 0; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .plant-mobile-id { margin-bottom: 3px; color: var(--muted); font-size: .72rem; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; }
    .plant-nickname { margin-top: 3px; color: var(--muted); font-style: italic; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
    .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 5px 8px; font-size: .8rem; font-weight: 750; }
    .stapeliad-milestone-age { color: var(--accent); font-size: .8rem; font-weight: 800; }
    .plant-card[data-category="Stapeliader"] .plant-card-milestone-slot { min-height:82px; }
    .plant-card[data-category="Stapeliader"] .stapeliad-milestone-age { flex-basis:100%; margin-left:24px; white-space:nowrap; }
    .notes { color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 8px; font-weight: 760; }
    .plant-card:has(.mobile-crossing-info) .plant-card-info { height: auto; overflow: visible; }
    .mobile-crossing-info { display: grid; gap: 9px; border-top: 1px solid var(--line); padding-top: 10px; }
    .mobile-crossing-info h3 { margin: 0; font: 700 1rem Georgia, "Times New Roman", serif; }
    .mobile-crossing-info dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 9px; margin: 0; font-size: .82rem; }
    .mobile-crossing-info dt { color: var(--muted); font-weight: 800; }
    .mobile-crossing-info dd { margin: 0; overflow-wrap: anywhere; }
    .mobile-crossing-parents { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .mobile-crossing-parent { display: grid; gap: 5px; min-width: 0; }
    .mobile-crossing-parent img, .mobile-crossing-parent .placeholder { width: 100%; height: 82px; object-fit: cover; border-radius: 10px; background: var(--chip); }
    .mobile-crossing-parent .placeholder { display: grid; place-items: center; color: var(--muted); font-size: .72rem; }
    .mobile-crossing-parent small { color: var(--accent); font-size: .68rem; font-weight: 900; text-transform: uppercase; }
    .mobile-crossing-parent strong, .mobile-crossing-parent span { overflow-wrap: anywhere; }
    .mobile-crossing-parent span { color: var(--muted); font-size: .75rem; font-weight: 800; }
    .mobile-crossing-events { margin: 0; padding-left: 18px; color: var(--muted); font-size: .8rem; }
    .empty { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 22px; color: var(--muted); text-align: center; font-weight: 750; }
    .mobile-view-toggle {
      position: fixed; right: 16px; bottom: max(76px, calc(env(safe-area-inset-bottom) + 76px)); z-index: 20;
      border: 0; border-radius: 999px; width: 52px; height: 52px; padding: 0;
      display: grid; place-items: center; background: rgba(96,119,97,.92); color: white;
      box-shadow: 0 12px 34px rgba(43,37,31,.18); cursor: pointer;
    }
    .mobile-view-toggle svg { width: 27px; height: 27px; display: block; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .mobile-view-toggle:active { transform: scale(.96); }
  </style>

  <script>
    if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js?v=23").catch(() => {}), {once: true});
    }
    let data = {};
    let crossingModel = null;
    let catalogReady = false;
    let logMap = combinedMilestonesByPlant(parseCSV(document.querySelector('#defaultMilestonesCSV').textContent));
    const tabs = document.querySelector('#tabs');
    const grid = document.querySelector('#grid');
    const cuttingsManager = document.querySelector('#cuttingsManager');
    const mobileChooserSearch = document.querySelector('#mobileChooserSearch');
    const mobileChooserList = document.querySelector('#mobileChooserList');
    const mobileChooserCategories = document.querySelector('#mobileChooserCategories');
    const mobileAddParentBtn = document.querySelector('#mobileAddParentBtn');
    const mobileAddParentDialog = document.querySelector('#mobileAddParentDialog');
    const mobileCloseParentDialog = document.querySelector('#mobileCloseParentDialog');
    const mobileManageBtn = document.querySelector('#mobileManageBtn');
    let manageMode = false;
    const mobileChooserCategoryNames = ['Alla', 'Hibiskus', 'Pelargon', 'Citrus', 'Udda', 'Stapeliader'];
    let mobileChooserCategory = 'Alla';
    const stats = document.querySelector('#stats');
    const search = document.querySelector('#search');
    const mobileViewToggle = document.querySelector('#mobileViewToggle');
    const mobileHeading = document.querySelector('#mobileHeading');
    const legacyMigration = document.querySelector('#legacyMigration');
    const legacyMigrationLink = document.querySelector('#legacyMigrationLink');
    const MOBILE_APP_VERSION = "2026-09-25-synk-1846";
    const MOBILE_CATALOG_CACHE_KEY = "mina-vaxter-mobile-catalog-v1";
    const initialParams = new URLSearchParams(window.location.search);
    const requestedCategory = initialParams.get('kategori');
    let active = 'Hibiskus';
    let lastCatalogCategory = 'Hibiskus';

    if (window.location.protocol === "http:") {
      legacyMigration.hidden = false;
      legacyMigrationLink.href = `https://${window.location.hostname}:8766/iphone.html`;
    }

    function clean(value) { return String(value || '').trim(); }
    function escapeHtml(value) { return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'); }
    function showCatalogLoadError() {
      tabs.innerHTML = '';
      stats.textContent = 'Katalogen kunde inte laddas';
      grid.innerHTML = '<div class="empty">Katalogdata kunde inte hämtas. Kontrollera anslutningen och uppdatera sidan.</div>';
      mobileViewToggle.hidden = true;
    }
    function snapshotToCatalog(snapshot) {
      const titleKeys = {Hibiskus: 'id', Pelargon: 'name', Citrus: 'name', Udda: 'name', Stapeliader: 'short_name'};
      if (!snapshot || snapshot.schemaVersion !== 4 || !snapshot.categories || typeof snapshot.categories !== 'object') {
        throw new Error('Katalogens format stöds inte.');
      }
      const result = {};
      for (const category of Object.keys(titleKeys)) {
        const section = snapshot.categories[category];
        if (!section || !Array.isArray(section.plants) || !Array.isArray(section.photos)) {
          throw new Error(`Katalogen saknar ${category}.`);
        }
        const photosByPlant = new Map();
        for (const photo of section.photos) {
          const plantId = clean(photo?.plant_id);
          if (!plantId) throw new Error(`Katalogen har en bild utan växt-ID i ${category}.`);
          const photos = photosByPlant.get(plantId) || [];
          photos.push(photo);
          photosByPlant.set(plantId, photos);
        }
        result[category] = {
          titleKey: titleKeys[category],
          photos: section.photos,
          rows: section.plants.map(plant => ({...plant, photos: photosByPlant.get(clean(plant.id)) || []}))
        };
      }
      return result;
    }
    function readCachedMobileCatalog() {
      try {
        const snapshot = JSON.parse(localStorage.getItem(MOBILE_CATALOG_CACHE_KEY) || "");
        window.publicCatalogSnapshot = snapshot;
        crossingModel = CrossingsCommon.createModel(snapshot);
        return snapshotToCatalog(snapshot);
      } catch (error) {
        return null;
      }
    }
    function saveCachedMobileCatalog(snapshot) {
      try { localStorage.setItem(MOBILE_CATALOG_CACHE_KEY, JSON.stringify(snapshot)); } catch (error) {}
    }
    async function loadPublicCatalog() {
      try {
        const versionResponse = await fetch('version.json', {cache: 'no-store'});
        if (!versionResponse.ok) throw new Error('Kunde inte hämta katalogversionen.');
        const versionInfo = await versionResponse.json();
        const version = clean(versionInfo?.version);
        if (!version) throw new Error('Katalogversion saknas.');
        const catalogResponse = await fetch(`public-data/catalog.json?v=${encodeURIComponent(version)}`);
        if (!catalogResponse.ok) throw new Error('Kunde inte hämta katalogdata.');
        const snapshot = await catalogResponse.json();
        if (clean(snapshot?.catalogVersion) !== version) throw new Error('Katalogversionerna stämmer inte överens.');
        window.publicCatalogSnapshot = snapshot;
        crossingModel = CrossingsCommon.createModel(snapshot);
        saveCachedMobileCatalog(snapshot);
        return snapshotToCatalog(snapshot);
      } catch (error) {
        const cached = readCachedMobileCatalog();
        if (cached) return cached;
        throw error;
      }
    }
    async function checkMobileVersion() {
      try {
        const response = await fetch(`version.json?check=${Date.now()}`, {cache: 'no-store'});
        if (!response.ok) return;
        const remote = await response.json();
        if (!remote.version || remote.version === MOBILE_APP_VERSION || document.querySelector('dialog[open]')) return;
        const reloadKey = `mina-vaxter-mobile-reload-${remote.version}`;
        try {
          if (sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, 'true');
        } catch (error) {}
        const url = new URL(window.location.href);
        url.searchParams.set('v', remote.version);
        url.searchParams.set('uppdaterad', Date.now().toString());
        preserveMobileView(url);
        window.location.replace(url.toString());
      } catch (error) {}
    }
    function preserveMobileView(url) {
      if (active === "Hundöron") url.searchParams.set("vy", "hundoron");
      else if (active === "Sticklingar") url.searchParams.set("vy", "sticklingar");
      else if (data[active]) url.searchParams.set("kategori", active);
    }
    function pageForCategory(category) {
      return {
        Hibiskus: "hibiskusar.html",
        Pelargon: "pelargoner.html",
        Citrus: "citrus.html",
        Udda: "udda.html",
        Stapeliader: "stapeliader.html"
      }[category] || "index.html";
    }
    function mobileChips(categoryName, row, logs) {
      if (categoryName === "Stapeliader") {
        const origin = ["Frö", "Stickling"].includes(clean(row.acquisition_type)) ? clean(row.acquisition_type) : "";
        return origin ? `<span class="chip green">${escapeHtml(origin)}</span>` : "";
      }
      const useful = new Set(["Frö", "Frösådd", "Individ", "🏷 Utvald", "Doft", "Unik", "Inne", "🌱 Stickling"]);
      const labels = collectionChips(categoryName, {...row, logs})
        .filter(label => useful.has(label))
        .slice(0, 2);
      return labels.map((label, index) => `<span class="chip ${index === 0 ? "green" : ""}"${label === "🌱 Stickling" ? ' data-status-chip="cuttings"' : ""}>${escapeHtml(label)}</span>`).join("");
    }
    function renderTabs() {
      const names = [...Object.keys(data), "Labbet", "Tidigare", "Växtliv", "Galleri", "Ankomstsamtal"];
      const tabLabel = name => name === "Stapeliader" ? "Stapelia" : name;
      tabs.innerHTML = names.map(name => `<button class="tab ${name === active ? 'active' : ''}" type="button" data-name="${escapeHtml(name)}">${escapeHtml(tabLabel(name))}</button>`).join('');
      requestAnimationFrame(() => tabs.querySelector('.tab.active')?.scrollIntoView({block: 'nearest', inline: 'nearest'}));
    }
    function mobilePlantHeadingHtml(row, identity, categoryName, crossingDisplay = null) {
      const nickname = clean(row.nickname);
      if (categoryName === "Stapeliader") {
        return `<h2>${escapeHtml(identity)}</h2><div class="plant-mobile-id">${escapeHtml(row.id)}</div>`;
      }
      if (categoryName === "Hibiskus" && nickname && /^HIB-/i.test(clean(row.id))) {
        return `<div class="plant-mobile-id">${escapeHtml(row.id)}</div><h2>${escapeHtml(nickname)}</h2>`;
      }
      if (categoryName === "Pelargon" && row.sow_batch_id) {
        const display = crossingDisplay || crossingModel.offspringDisplay(row);
        return `<h2>${escapeHtml(display.title)}</h2>${display.subline ? `<div class="plant-nickname">${escapeHtml(display.subline)}</div>` : ""}`;
      }
      if (["Pelargon", "Citrus"].includes(categoryName) && clean(row.record_kind).toUpperCase() === "INDIVIDUAL") {
        return plantHeadingHtml(row, identity, true);
      }
      return plantHeadingHtml(row, identity);
    }

    function mobileCrossingDate(value) {
      const date = localDate(value);
      return date ? date.toLocaleDateString("sv-SE", {day: "numeric", month: "short", year: "numeric"}) : clean(value);
    }

    function mobileCrossingPhoto(plant) {
      if (plant?.card_image) return plant.card_image;
      const photos = window.publicCatalogSnapshot?.categories?.Pelargon?.photos || [];
      return photos.filter(photo => photo.plant_id === plant?.id).sort((a, b) => String(a.date).localeCompare(String(b.date))).at(-1)?.file || "";
    }

    function mobileCrossingInfoHtml(crossingData) {
      const parent = (display, role) => {
        const photo = mobileCrossingPhoto(display.plant);
        return `<article class="mobile-crossing-parent">${photo ? `<img src="${escapeHtml(photo)}" alt="${escapeHtml(`${role} ${display.primary}`)}" loading="lazy">` : '<div class="placeholder">Ingen bild</div>'}<small>${escapeHtml(role)}</small><strong>${escapeHtml(display.primary)}</strong><span>${escapeHtml(display.visibleId)}</span></article>`;
      };
      const eventItems = crossingData.events.filter(event => event.type !== "Sådd").map(event => `<li>${escapeHtml(event.type)}: ${escapeHtml(mobileCrossingDate(event.date))}</li>`).join("");
      const counts = crossingData.counts;
      return `<section class="mobile-crossing-info" aria-label="Korsningsinformation"><h3>${escapeHtml(crossingData.parentName)}</h3><div class="mobile-crossing-parents">${parent(crossingData.mother, "♀ Moder")}${parent(crossingData.father, "♂ Pollen")}</div><h3>Fröomgång ${escapeHtml(crossingData.seedLot.seed_lot_code)}</h3><ul class="mobile-crossing-events">${eventItems || "<li>Inga händelser ännu.</li>"}</ul>${crossingData.seedLotView.harvestedCount ? `<div>${escapeHtml(crossingData.seedLotView.harvestedCount)} frön skördade</div>` : ""}<dl><dt>Status</dt><dd>${escapeHtml(crossingData.displayStatus)}</dd><dt>Såbatch</dt><dd>${escapeHtml(crossingData.batchCode)}</dd><dt>Sådd</dt><dd>${escapeHtml(mobileCrossingDate(crossingData.batch.sown_date))}</dd><dt>Antal</dt><dd>${escapeHtml(counts.seedsSown)} sådda · ${escapeHtml(counts.potCount)} ${counts.potCount === 1 ? "kruka" : "krukor"} · ${escapeHtml(counts.germinated)} grodda · ${escapeHtml(counts.offspring)} avkommor</dd></dl></section>`;
    }

    function mobileStapeliadDetailPanel(id) {
      const row = data?.Stapeliader?.rows?.find(plant => plant.id === id);
      if (!row) return "";
      const fact = (label, value) => clean(value) ? `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(clean(value))}</dd>` : "";
      const veto = clean(row.scent_veto).toLowerCase() === "ja";
      return `<section class="plant-panel-section" aria-label="Stapeliaddata">
        <div class="plant-panel-section-title">Stapeliaddata</div>
        <dl>
          ${fact("Fullständigt botaniskt namn", row.full_botanical_name)}
          ${fact("Etikettnamn", row.short_name)}
          ${fact("Inköpsnamn från leverantören", row.supplier_purchase_name)}
          ${fact("Accession/fältnummer", row.accession_field_number)}
          ${fact("Proveniens/lokalitet", row.provenance_location)}
          ${fact("Accepterat namn/synonym", row.accepted_name_or_synonym)}
          ${fact("Leverantör", row.supplier)}
          ${fact("Ordernummer", row.order_number)}
          ${fact("Typ", row.acquisition_type)}
          ${fact("Inköpsdatum", row.purchase_date)}
          ${fact("Ankomstdatum", row.arrival_date)}
          ${fact("Sådatum", row.sown_date)}
          ${fact("Grodddatum", row.germination_date)}
          ${fact("Status", row.status)}
          ${fact("Förväntad doft", row.expected_scent)}
          ${fact("Egen doftobservation", row.own_scent_observation)}
          ${fact("Doftstyrka", clean(row.scent_strength) ? `${row.scent_strength}/5` : "")}
          ${fact("Doftbeskrivning", row.scent_description)}
          ${fact("Doftavstånd", row.scent_distance)}
          ${fact("☠️-flagga", veto ? "Ja" : "")}
          ${fact("Anteckningar", row.notes)}
        </dl>
        ${veto ? '<p>☠️ Näsan har lagt in sitt veto.</p>' : ''}
      </section>`;
    }
    function dogEarIcon() {
      return '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 4.5h12.5L25 10v17.5H7z"/><path d="M19.5 4.5V10H25"/></svg>';
    }
    function catalogIcon() {
      return '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><rect x="18" y="5" width="9" height="9" rx="1.5"/><rect x="5" y="18" width="9" height="9" rx="1.5"/><rect x="18" y="18" width="9" height="9" rx="1.5"/></svg>';
    }
    function updateMobileViewToggle() {
      const inFavorites = active === "Hundöron";
      mobileViewToggle.innerHTML = inFavorites ? catalogIcon() : dogEarIcon();
      mobileViewToggle.setAttribute('aria-label', inFavorites ? `Tillbaka till ${lastCatalogCategory}` : 'Öppna Hundöron');
      mobileViewToggle.title = inFavorites ? 'Katalog' : 'Hundöron';
    }
    function updateMobileWishlist() {
      const category = data[active] ? active : '';
      mobileHeading.dataset.wishlistCategory = category;
      document.dispatchEvent(new CustomEvent('wishlist-category-changed', {detail: {category}}));
    }
    function stapeliadCardInfo(row) {
      const provenance = clean(row.provenance_location);
      const parts = provenance.split(" · ");
      const compactProvenance = provenance.length > 36 && parts.length > 2
        ? parts.slice(-2).join(" · ") : provenance;
      return [
        [clean(row.supplier), "Leverantör", "supplier"],
        [clean(row.accession_field_number), "Accession/fältnummer", "accession"],
        [compactProvenance, "Proveniens/lokalitet", "provenance"]
      ].filter(([value]) => value).map(([value, label, role]) =>
        `<span class="stapeliad-info-line stapeliad-info-line--${role}" aria-label="${escapeHtml(label)}">${escapeHtml(value)}</span>`
      ).join("");
    }

    function localDate(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(clean(value));
      if (!match) return null;
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      return date.getFullYear() === Number(match[1])
        && date.getMonth() === Number(match[2]) - 1
        && date.getDate() === Number(match[3]) ? date : null;
    }

    function daysSinceGermination(logs) {
      const germination = (logs || [])
        .filter(log => clean(log.type).toLocaleLowerCase("sv") === "grodd")
        .sort((a, b) => sortNatural(a.date, b.date))
        .at(-1);
      const germinationDate = localDate(germination?.date);
      if (!germinationDate) return "";
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.max(0, Math.floor((today - germinationDate) / 86400000));
      return `${days} ${days === 1 ? "dag" : "dagar"} sedan grodd`;
    }

    function stapeliadMilestoneSummary(logs) {
      const latest = latestPlantMilestone(logs);
      if (!latest) return "";
      const age = daysSinceGermination(logs);
      return `
        <div class="milestone">
          <div class="milestone-label">Senaste milstolpe</div>
          <div class="milestone-value"><span>${escapeHtml(milestoneIcon(latest.type))}</span><strong>${escapeHtml(latest.type)}</strong><span>${escapeHtml(latest.date)}</span>${age ? `<span class="stapeliad-milestone-age">${escapeHtml(age)}</span>` : ""}</div>
        </div>
      `;
    }
    function showMobileView(name) {
      if (name !== "Hundöron" && data[name]) lastCatalogCategory = name;
      if (name === active) return;
      active = name;
      updateMobileWishlist();
      search.value = '';
      render();
    }
    function card(section, row, categoryName) {
      if (active === "Sticklingar") return mobileCuttingsCard(section, row, categoryName);
      const photos = row.photos || [];
      const crossingData = categoryName === "Pelargon" ? crossingModel.plantCrossingView(row) : null;
      const crossingDisplay = crossingData?.offspringDisplay || null;
      const identity = categoryName === "Stapeliader"
        ? (clean(row.full_botanical_name) || clean(row.short_name) || clean(row.id))
        : (crossingDisplay
          ? crossingDisplay.catalogIdentity
          : (clean(row[section.titleKey]) || clean(row.id)));
      const nickname = clean(row.nickname);
      const title = crossingDisplay?.catalogTitle || identity || nickname;
      const displayLabel = crossingDisplay?.catalogLabel || (nickname ? `${identity} · ${nickname}` : identity);
      const flowerPhotos = categoryName === "Hibiskus"
        ? photos.filter(photo => clean(photo.type).toLowerCase() === "blomma")
        : [];
      const activePhoto = flowerPhotos[flowerPhotos.length - 1] || photos[photos.length - 1];
      const gallery = photos.map(photo => {
        const label = photo.label || photo.date || title;
        return {file: photo.file, title, caption: `${displayLabel} · ${label}`, alt: displayLabel};
      });
      const activeLabel = activePhoto ? (activePhoto.label || activePhoto.date || title) : "";
      const logs = logMap.get(row.id) || [];
      const latestMilestone = latestPlantMilestone(logs);
      const thumbs = photos.length > 1 ? `<div class="photo-strip">${photos.map(photo => `
        <button class="photo-button ${photo.file === activePhoto.file ? 'active' : ''}" type="button" data-file="${escapeHtml(photo.file)}" data-label="${escapeHtml(photo.label || photo.date || title)}" data-photo-type="${escapeHtml(photo.type)}" aria-label="${escapeHtml(photo.label || photo.date || title)}">
          <img src="${escapeHtml(photo.file)}" alt="" loading="lazy">
        </button>`).join('')}</div>` : '';
      const image = activePhoto
        ? `<div class="image"><img class="main-photo" src="${escapeHtml(activePhoto.file)}" alt="${escapeHtml(displayLabel)}" data-caption="${escapeHtml(displayLabel + " · " + activeLabel)}" data-photo-type="${escapeHtml(activePhoto.type)}" loading="lazy"><div class="plant-card-gallery-slot ${photos.length > 1 ? "has-gallery" : ""}">${thumbs}</div></div>`
        : `<div class="image"><div class="plant-card-gallery-slot"></div></div>`;
      const chips = mobileChips(categoryName, row, logs);
      const cardNote = categoryName === "Stapeliader" ? "" : plantCardNoteField(row.id, row.card_note, row.card_note_updated_at, categoryName);
      const collectionName = ["Pelargon", "Citrus"].includes(categoryName) && row.collection_id
        ? clean(section.rows.find(item => item.id === row.collection_id)?.name)
        : "";
      let recordInfo = categoryName === "Stapeliader"
        ? stapeliadCardInfo(row)
        : ["Pelargon", "Citrus"].includes(categoryName) ? collectionRecordInfoHtml(row, collectionName) : "";
      if (crossingData?.batch && crossingData.seedLot) recordInfo += mobileCrossingInfoHtml(crossingData);
      const parentCross = categoryName === "Hibiskus" ? hibiscusCrossLabel(row) : (crossingData ? `${crossingData.crossing.mother_id} × ${crossingData.crossing.father_id}` : "");
      const parentReferences = categoryName === "Hibiskus" ? hibiscusParentReferenceItems(row) : [];
      return `<article class="card plant-card" data-category="${escapeHtml(categoryName)}" data-record-kind="${escapeHtml(row.record_kind)}" data-status="${escapeHtml(row.status)}" data-plant-id="${escapeHtml(row.id)}" data-plant-name="${escapeHtml(title)}" data-plant-identity="${escapeHtml(identity)}" data-plant-nickname="${escapeHtml(nickname)}" data-parent-cross="${escapeHtml(parentCross)}" data-parent-references="${escapeHtml(JSON.stringify(parentReferences))}" data-card-image="${escapeHtml(row.card_image)}" data-card-crop-x="${escapeHtml(row.card_crop_x)}" data-card-crop-y="${escapeHtml(row.card_crop_y)}" data-card-image-updated-at="${escapeHtml(row.card_image_updated_at)}" data-cuttings-available="${escapeHtml(row.cuttings_available)}" data-cuttings-updated-at="${escapeHtml(row.cuttings_updated_at)}" data-page="${escapeHtml(pageForCategory(categoryName))}" data-gallery="${escapeHtml(JSON.stringify(gallery))}" data-milestones="${escapeHtml(JSON.stringify(logs))}">
        ${image}
        <div class="body card-body">
          <div class="plant-card-head">
            <div class="plant-title-block">${mobilePlantHeadingHtml(row, identity, categoryName, crossingDisplay)}</div>
            <div class="import-actions">
              <button class="plant-log-btn" type="button" aria-label="Växtpanel" title="Växtpanel">${logBookIcon()}</button>
              ${categoryName === "Stapeliader" ? "" : `<button class="add-photo-btn" type="button" aria-label="Lägg till bild" title="Lägg till bild">${cameraLineIcon()}</button>`}
              <span class="import-badge" data-import-badge hidden></span>
            </div>
          </div>
          <div class="plant-card-chip-slot"><div class="chips">${chips}</div></div>
          <div class="plant-card-info">${recordInfo}</div>
          <div class="plant-card-milestone-slot">${categoryName === "Stapeliader" ? stapeliadMilestoneSummary(logs) : milestoneSummary(latestMilestone)}</div>
          <div class="plant-card-notes-slot">${cardNote}</div>
          ${active === "Sticklingar" ? `<button class="cuttings-remove" type="button" data-remove-cuttings="${escapeHtml(row.id)}" data-remove-category="${escapeHtml(categoryName)}">Ta bort från Sticklingar</button>` : ""}
        </div>
      </article>`;
    }
    function mobileCuttingsCard(section, row, categoryName) {
      const identity = clean(row[section.titleKey]) || clean(row.id);
      const nickname = clean(row.nickname);
      const displayName = categoryName === "Pelargon" && nickname ? nickname : identity;
      const secondary = categoryName === "Pelargon" && nickname ? identity : clean(row.latin);
      const photos = row.photos || [];
      const photo = photos.at(-1);
      const logs = logMap.get(row.id) || [];
      const parentCross = categoryName === "Hibiskus" ? hibiscusCrossLabel(row) : "";
      const parentReferences = categoryName === "Hibiskus" ? hibiscusParentReferenceItems(row) : [];
      return `<article class="card plant-card cuttings-card" data-category="${escapeHtml(categoryName)}" data-plant-id="${escapeHtml(row.id)}" data-plant-name="${escapeHtml(identity)}" data-plant-identity="${escapeHtml(identity)}" data-plant-nickname="${escapeHtml(nickname)}" data-parent-cross="${escapeHtml(parentCross)}" data-parent-references="${escapeHtml(JSON.stringify(parentReferences))}" data-card-image="${escapeHtml(row.card_image)}" data-card-image-updated-at="${escapeHtml(row.card_image_updated_at)}" data-cuttings-available="ja" data-page="${escapeHtml(pageForCategory(categoryName))}" data-gallery="[]" data-milestones="${escapeHtml(JSON.stringify(logs))}">
        <div class="image">${photo?.file ? `<img src="${escapeHtml(photo.file)}" alt="${escapeHtml(displayName)}" loading="lazy">` : '<div class="image-empty">Bild saknas</div>'}</div>
        <div class="body"><h2>${escapeHtml(displayName)}</h2>${secondary && secondary !== displayName ? `<div class="latin">${escapeHtml(secondary)}</div>` : ""}<button class="cuttings-remove" type="button" data-remove-cuttings="${escapeHtml(row.id)}" data-remove-category="${escapeHtml(categoryName)}">Ta bort</button></div>
      </article>`;
    }
    function favoriteCard(item) {
      const identity = clean(item.plantIdentity) || clean(item.plantName);
      const nickname = clean(item.plantNickname) || (item.plantIdentity && item.plantName !== item.plantIdentity ? clean(item.plantName) : "");
      const nicknameFirst = item.category === "Pelargon" && Boolean(nickname && identity);
      const displayLabel = nickname ? `${identity} · ${nickname}` : identity;
      const gallery = item.image ? [{file: item.image, title: identity, caption: `${displayLabel} · ${item.dateLabel || ""}`, alt: displayLabel}] : [];
      const logs = logMap.get(item.plantId) || [];
      const latestMilestone = latestPlantMilestone(logs);
      const cardNote = ["Hibiskus", "Pelargon", "Citrus", "Udda"].includes(item.category)
        ? plantCardNoteField(item.plantId, "", "", item.category)
        : "";
      const hasCuttings = getPlantCuttingsStatus(item.plantId, item.cuttingsAvailable ? "ja" : "nej", item.cuttingsUpdatedAt || "");
      return `<article class="card plant-card" data-category="${escapeHtml(item.category)}" data-plant-id="${escapeHtml(item.plantId)}" data-plant-name="${escapeHtml(identity)}" data-plant-identity="${escapeHtml(identity)}" data-plant-nickname="${escapeHtml(nickname)}" data-cuttings-available="${hasCuttings ? "ja" : "nej"}" data-cuttings-updated-at="${escapeHtml(item.cuttingsUpdatedAt || "")}" data-page="${escapeHtml(item.page || pageForCategory(item.category))}" data-gallery="${escapeHtml(JSON.stringify(gallery))}" data-milestones="${escapeHtml(JSON.stringify(logs))}">
        <div class="image">${item.image ? `<img class="main-photo" src="${escapeHtml(item.image)}" alt="${escapeHtml(displayLabel)}" data-caption="${escapeHtml(displayLabel + (item.dateLabel ? " · " + item.dateLabel : ""))}" loading="lazy">` : ""}<div class="plant-card-gallery-slot"></div></div>
        <div class="body card-body">
          <div class="plant-card-head">
            <div class="plant-title-block"><h2>${escapeHtml(nicknameFirst ? nickname : identity)}</h2>${nickname ? `<div class="plant-nickname">${escapeHtml(nicknameFirst ? identity : nickname)}</div>` : ""}${item.latin ? `<div class="latin">${escapeHtml(item.latin)}</div>` : ""}</div>
            <div class="import-actions">
              <button class="plant-log-btn" type="button" aria-label="Växtpanel" title="Växtpanel">${logBookIcon()}</button>
              <button class="add-photo-btn" type="button" aria-label="Lägg till bild" title="Lägg till bild">${cameraLineIcon()}</button>
              <span class="import-badge" data-import-badge hidden></span>
            </div>
          </div>
          <div class="plant-card-chip-slot"><div class="chips">${hasCuttings ? '<span class="chip green" data-status-chip="cuttings">🌱 Stickling</span>' : `<span class="chip">${escapeHtml(item.category)}</span>`}</div></div>
          <div class="plant-card-info"></div>
          <div class="plant-card-milestone-slot">${milestoneSummary(latestMilestone)}</div>
          <div class="plant-card-notes-slot">${cardNote || (item.focusNote ? `<div class="notes">${escapeHtml(item.focusNote)}</div>` : item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : "")}</div>
        </div>
      </article>`;
    }
    function render() {
      if (!catalogReady) return;
      document.body.dataset.concludedPlantArchive = active === "Tidigare" ? "true" : "false";
      cuttingsManager.hidden = active !== "Sticklingar";
      document.body.classList.toggle("manage-mode", manageMode && active === "Sticklingar");
      grid.style.alignItems = active === "Sticklingar" ? "start" : "";
      grid.style.gridAutoRows = active === "Sticklingar" ? "max-content" : "";
      renderTabs();
      updateMobileViewToggle();
      if (active === "Hundöron") {
        const favorites = Object.values(getPlantFavorites()).sort((a, b) => sortNatural(`${a.category} ${a.plantName}`, `${b.category} ${b.plantName}`));
        const q = search.value.trim().toLowerCase();
        const rows = favorites.filter(item => !q || JSON.stringify(item).toLowerCase().includes(q));
        stats.textContent = `${rows.length} hundöron`;
        grid.innerHTML = rows.length ? rows.map(favoriteCard).join('') : '<div class="empty">Inga hundöron ännu. Markera en växt med hundörat på ett kort.</div>';
        updatePlantFavoriteUI();
        return;
      }
      if (active === "Sticklingar") {
        const q = search.value.trim().toLowerCase();
        const rows = Object.entries(data).flatMap(([categoryName, section]) =>
          section.rows
            .filter(row => getPlantCuttingsStatus(row.id, row.cuttings_available, row.cuttings_updated_at)
              && !plantStatusRemovesFromActiveCollection(row.status)
              && !isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || [])))
            .map(row => ({categoryName, section, row}))
        ).filter(item => !q || JSON.stringify(item.row).toLowerCase().includes(q));
        stats.textContent = `${rows.length} ${rows.length === 1 ? "växt" : "växter"} med sticklingar`;
        grid.innerHTML = rows.length
          ? rows.map(item => card(item.section, item.row, item.categoryName)).join('')
          : '<div class="empty">Inga moderplantor är markerade ännu. Lägg till en moderplanta ovan.</div>';
        updatePlantFavoriteUI();
        renderMobileChooser();
        return;
      }
      if (active === "Tidigare") {
        const q = search.value.trim().toLowerCase();
        const rows = Object.entries(data).flatMap(([categoryName, section]) =>
          section.rows.filter(row => plantStatusRemovesFromActiveCollection(row.status)
            || isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || [])))
            .map(row => ({categoryName, section, row}))
        ).filter(item => !q || JSON.stringify(item.row).toLowerCase().includes(q));
        rows.sort((a, b) => sortNatural(`${a.categoryName} ${a.row.name || a.row.nickname || a.row.id}`, `${b.categoryName} ${b.row.name || b.row.nickname || b.row.id}`));
        stats.textContent = `${rows.length} ${rows.length === 1 ? "tidigare växt" : "tidigare växter"}`;
        grid.innerHTML = rows.length ? rows.map(item => card(item.section, item.row, item.categoryName)).join('') : '<div class="empty">Inga tidigare växter ännu.</div>';
        updatePlantFavoriteUI();
        return;
      }
      const section = data[active];
      const q = search.value.trim().toLowerCase();
      const rows = section.rows.filter(row => !q || JSON.stringify(row).toLowerCase().includes(q));
      if (["Pelargon", "Citrus"].includes(active)) {
        rows.sort((a, b) => (clean(a.record_kind).toUpperCase() === "INDIVIDUAL" ? 0 : 1)
          - (clean(b.record_kind).toUpperCase() === "INDIVIDUAL" ? 0 : 1));
      }
      if (["Pelargon", "Citrus"].includes(active)) {
        const collections = section.rows.filter(row => clean(row.record_kind).toUpperCase() === "COLLECTION");
        const individuals = section.rows.filter(row => clean(row.record_kind).toUpperCase() === "INDIVIDUAL");
        const specimens = collections.reduce((sum, row) => sum + (Number.parseInt(row.specimen_count, 10) || 0), 0);
        stats.textContent = `${collections.length} sorter/arter · ${individuals.length} individer · ${specimens} exemplar · ${rows.length} visas`;
      } else {
        stats.textContent = `${rows.length} visas av ${section.rows.length}`;
      }
      grid.innerHTML = rows.length ? rows.map(row => card(section, row, active)).join('') : '<div class="empty">Inga växter matchar sökningen.</div>';
      updatePlantFavoriteUI();
    }
    function renderMobileChooser() {
      if (!catalogReady) return;
      const query = mobileChooserSearch.value.trim().toLocaleLowerCase("sv");
      mobileChooserCategories.innerHTML = mobileChooserCategoryNames.map(category =>
        `<button class="mobile-chooser-category ${mobileChooserCategory === category ? 'active' : ''}" type="button" data-mobile-chooser-category="${escapeHtml(category)}" aria-pressed="${mobileChooserCategory === category}">${escapeHtml(category === 'Stapeliader' ? 'Stapelia' : category)}</button>`
      ).join('');
      if (mobileChooserCategory === 'Alla' && !query) {
        mobileChooserList.innerHTML = '<div class="mobile-chooser-empty">Välj en kategori eller börja skriva för att söka.</div>';
        return;
      }
      const candidates = Object.entries(data).flatMap(([categoryName, section]) => section.rows
        .filter(row => (mobileChooserCategory === 'Alla' || categoryName === mobileChooserCategory)
          && !getPlantCuttingsStatus(row.id, row.cuttings_available, row.cuttings_updated_at)
          && !plantStatusRemovesFromActiveCollection(row.status)
          && !isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || [])))
        .map(row => ({categoryName, section, row})))
        .filter(item => !query || `${item.categoryName} ${item.row.name || ''} ${item.row.nickname || ''} ${item.row.latin || ''} ${item.row.type || ''} ${JSON.stringify(item.row)}`.toLocaleLowerCase("sv").includes(query));
      mobileChooserList.innerHTML = candidates.length ? candidates.map(item => {
        const identity = clean(item.row[item.section.titleKey]) || clean(item.row.id);
        const nickname = clean(item.row.nickname);
        const label = item.categoryName === 'Pelargon' && nickname ? nickname : identity;
        const identifier = clean(item.row.label_number) || clean(item.row.id);
        const image = (item.row.photos || []).at(-1)?.file || item.row.card_image;
        return `<button class="mobile-chooser-item" type="button" data-add-cuttings="${escapeHtml(item.row.id)}" data-add-category="${escapeHtml(item.categoryName)}">
          ${image ? `<img src="${escapeHtml(image)}" alt="">` : '<span class="mobile-chooser-empty-image" aria-hidden="true"></span>'}
          <span><strong>${escapeHtml(label)}</strong><small>${escapeHtml(identifier)}</small></span>
        </button>`;
      }).join("") : '<div class="mobile-chooser-empty">Ingen omarkerad växt matchar sökningen.</div>';
    }
    tabs.addEventListener('click', event => {
      const button = event.target.closest('.tab');
      if (button && button.dataset.name === "Galleri") {
        window.location.href = "galleri.html?v=2026-09-25-synk-1846";
        return;
      }
      if (button && button.dataset.name === "Växtliv") {
        window.location.href = "vaxtliv.html";
        return;
      }
      if (button && button.dataset.name === "Labbet") {
        window.location.href = "labbet.html";
        return;
      }
      if (button && button.dataset.name === "Ankomstsamtal") {
        window.location.href = "verktyg.html#ankomstsamtal";
        return;
      }
      if (!button) return;
      showMobileView(button.dataset.name);
    });
    mobileViewToggle.addEventListener('click', () => {
      showMobileView(active === "Hundöron" ? lastCatalogCategory : "Hundöron");
    });
    let pullStartY = null;
    let pullDistance = 0;
    let pullReloading = false;
    const pullPage = document.querySelector('#pullPage');
    const pullRefreshStatus = document.querySelector('#pullRefreshStatus');
    document.addEventListener('touchstart', event => {
      if (window.scrollY <= 0 && event.touches.length === 1) {
        pullStartY = event.touches[0].clientY;
        pullDistance = 0;
        document.body.classList.add('pull-active');
      } else pullStartY = null;
    }, {passive: true});
    document.addEventListener('touchmove', event => {
      if (pullStartY === null || event.touches.length !== 1 || window.scrollY > 0) return;
      pullDistance = Math.max(0, event.touches[0].clientY - pullStartY);
      const offset = Math.min(104, pullDistance * 0.72);
      pullPage.style.setProperty('--pull-offset', `${offset}px`);
      document.body.classList.toggle('pull-revealed', offset >= 48);
      pullRefreshStatus.textContent = pullDistance >= 95 ? 'Släpp för att uppdatera' : 'Dra nedåt för att uppdatera';
      if (pullDistance > 12) event.preventDefault();
    }, {passive: false});
    document.addEventListener('touchend', () => {
      if (pullDistance >= 75 && !pullReloading) {
        pullReloading = true;
        document.body.classList.remove('pull-active');
        document.body.classList.add('pull-refreshing');
        pullPage.style.setProperty('--pull-offset', `${Math.max(68, Math.min(104, pullDistance * 0.72))}px`);
        pullRefreshStatus.textContent = 'Uppdaterar…';
        const url = new URL(window.location.href);
        url.searchParams.set('v', MOBILE_APP_VERSION);
        url.searchParams.set('uppdaterad', Date.now().toString());
        preserveMobileView(url);
        window.setTimeout(() => window.location.replace(url.toString()), 180);
      } else {
        document.body.classList.remove('pull-active');
        document.body.classList.remove('pull-revealed');
        pullPage.style.removeProperty('--pull-offset');
      }
      pullStartY = null;
      pullDistance = 0;
    }, {passive: true});
    document.addEventListener('touchcancel', () => {
      pullStartY = null;
      pullDistance = 0;
      document.body.classList.remove('pull-active');
      document.body.classList.remove('pull-revealed');
      pullPage.style.removeProperty('--pull-offset');
    }, {passive: true});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkMobileVersion();
    });
    window.addEventListener('pageshow', checkMobileVersion);
    grid.addEventListener('click', event => {
      const button = event.target.closest('.photo-button');
      const main = event.target.closest('.main-photo');
      const cuttingsCard = event.target.closest('.cuttings-card');
      if (button) {
        const card = button.closest('.card');
        const image = card.querySelector('.main-photo');
        if (!image) return;
        image.src = button.dataset.file;
        image.dataset.photoType = button.dataset.photoType || '';
        image.dataset.caption = `${image.alt} · ${button.dataset.label}`;
        card.querySelectorAll('.photo-button').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
      }
      if (main) openPlantPhotoGallery(main);
      const remove = event.target.closest("[data-remove-cuttings]");
      if (remove) setPlantCuttingsStatus(remove.dataset.removeCuttings, remove.dataset.removeCategory, false);
      if (cuttingsCard && !event.target.closest("button, input, a") && !manageMode) openPlantPanel(cuttingsCard);
    });
    document.addEventListener('click', event => {
      if (active === "Hundöron" && event.target.closest('.favorite-corner')) {
        setTimeout(render, 0);
      }
    });
    search.addEventListener('input', render);
    mobileChooserSearch.addEventListener('input', renderMobileChooser);
    mobileChooserList.addEventListener('click', event => {
      const add = event.target.closest('[data-add-cuttings]');
      if (!add) return;
      setPlantCuttingsStatus(add.dataset.addCuttings, add.dataset.addCategory, true);
      mobileAddParentDialog.close();
    });
    mobileAddParentBtn.addEventListener('click', () => { renderMobileChooser(); mobileAddParentDialog.showModal(); });
    mobileCloseParentDialog.addEventListener('click', () => mobileAddParentDialog.close());
    mobileAddParentDialog.addEventListener('click', event => { if (event.target === mobileAddParentDialog) mobileAddParentDialog.close(); });
    mobileChooserCategories.addEventListener('click', event => {
      const category = event.target.closest('[data-mobile-chooser-category]');
      if (!category) return;
      mobileChooserCategory = category.dataset.mobileChooserCategory;
      renderMobileChooser();
    });
    mobileManageBtn.addEventListener('click', () => {
      manageMode = !manageMode;
      document.body.classList.toggle('manage-mode', manageMode && active === 'Sticklingar');
      mobileManageBtn.textContent = manageMode ? 'Klar' : 'Hantera';
      render();
    });
    document.addEventListener('plant-concluded-filter-applied', event => {
      if (!catalogReady || active === "Hundöron" || !data[active]) return;
      const visibleCount = [...grid.querySelectorAll('.plant-card')]
        .filter(card => card.dataset.concludedHidden !== "true").length;
      const allRows = data[active].rows;
      const concludedTotal = allRows.filter(row =>
        isConcludedPlantMilestone(latestPlantMilestone(logMap.get(row.id) || []))
      ).length;
      const total = event.detail.concludedOnly ? concludedTotal : allRows.length - concludedTotal;
      stats.textContent = `${visibleCount} visas av ${total}`;
    });
    window.addEventListener('plant-milestone-added', () => {
      logMap = combinedMilestonesByPlant(parseCSV(document.querySelector('#defaultMilestonesCSV').textContent));
      render();
    });
    window.addEventListener('plant-status-changed', render);
    window.addEventListener('plant-status-changed', renderMobileChooser);
    async function initialiseCatalog() {
      try {
        data = await loadPublicCatalog();
        window.stapeliadDetailPanelHtml = mobileStapeliadDetailPanel;
        const initialCategory = requestedCategory && data[requestedCategory] ? requestedCategory : 'Hibiskus';
        if (initialParams.get('vy') === 'korsningar') {
          window.location.replace('korsningar.html');
          return;
        }
        active = initialParams.get('vy') === 'hundoron' ? 'Hundöron' : (initialParams.get('vy') === 'sticklingar' ? 'Sticklingar' : initialCategory);
        lastCatalogCategory = initialCategory;
        catalogReady = true;
        mobileViewToggle.hidden = false;
        ensurePlantPhotoGallery();
        ensurePlantMilestones();
        ensurePlantImageImport();
        updateMobileWishlist();
        ensurePrivateWishlists();
        ensurePlantFavorites();
        render();
        renderMobileChooser();
        checkMobileVersion();
      } catch (error) {
        console.error('Kunde inte ladda katalogdata.', error);
        showCatalogLoadError();
      }
    }
    initialiseCatalog();
  </script>
</body>
</html>
